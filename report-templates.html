<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Templates — QFX</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
/* ─── Rocket DS tokens ───────────────────────────────────────────────────── */
:root {
  --c-text-primary:    #2f3337;
  --c-text-secondary:  rgba(47,51,55,0.65);
  --c-text-disabled:   rgba(47,51,55,0.38);
  --c-surface:         #ffffff;
  --c-surface-raised:  #f6f7f8;
  --c-surface-bg:      #f0f1f3;
  --c-bg:              var(--c-surface-raised);
  --c-border:          rgba(0,0,0,0.12);
  --c-divider:         rgba(0,0,0,0.09);
  --c-overlay-hover:   rgba(0,0,0,0.04);
  --c-primary:         #055b61;
  --c-primary-hover:   #044950;
  --c-primary-subtle:  rgba(5,91,97,0.07);
  --c-primary-text:    #055b61;
  --c-danger:          #ce3e37;

  --r-md: 8px;
  --r-lg: 10px;
  --r-pill: 999px;

  --shadow-card:       0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
  --shadow-modal:      0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --t-fast: 120ms;
  --t-med:  200ms;
  --ease:   cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font);
  font-size: 14px;
  color: var(--c-text-primary);
  background: var(--c-bg);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ─── Topbar ─────────────────────────────────────────────────────────────── */
.topbar {
  height: 52px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ─── View toggle ────────────────────────────────────────────────────────── */
.view-toggle {
  display: flex;
  align-items: center;
  background: var(--c-surface-raised);
  border-radius: 6px;
  padding: 2px;
  gap: 0;
}
.vt-btn {
  width: 28px; height: 28px;
  border: none; background: transparent;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--c-text-secondary);
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
}
.vt-btn.active {
  background: var(--c-surface);
  color: var(--c-text-primary);
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.vt-btn:not(.active):hover { color: var(--c-text-primary); }

/* ─── Buttons ────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 36px;
  padding: 0 16px;
  border-radius: 4px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast);
  outline: none;
  letter-spacing: 0;
}
.btn:focus-visible { box-shadow: 0 0 0 3px rgba(5,91,97,0.2); }
.btn i { font-size: 16px; }
.btn-primary {
  background: var(--c-primary);
  color: white;
  border-color: var(--c-primary);
}
.btn-primary:hover { background: var(--c-primary-hover); border-color: var(--c-primary-hover); }
.btn-outline {
  background: transparent;
  color: var(--c-text-primary);
  border-color: rgba(0,0,0,0.12);
}
.btn-outline:hover { background: var(--c-overlay-hover); }
.btn-danger {
  background: var(--c-danger);
  color: white;
  border-color: var(--c-danger);
}
.btn-danger:hover { background: #b0332c; border-color: #b0332c; }

/* ─── Main scroll area ───────────────────────────────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px 72px;
}
.content-wrap {
  max-width: 1100px;
  margin: 0 auto;
}

/* ─── Search bar ─────────────────────────────────────────────────────────── */
.search-wrap {
  position: relative;
  margin-bottom: 24px;
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--c-text-secondary);
  pointer-events: none;
}
.search-input {
  width: 100%;
  height: 38px;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 0 36px 0 36px;
  font-family: var(--font);
  font-size: 13px;
  color: var(--c-text-primary);
  background: var(--c-surface);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.search-input::placeholder { color: var(--c-text-disabled); }
.search-input:focus {
  border-color: #055b61;
  box-shadow: 0 0 0 3px rgba(5,91,97,0.12);
}
.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px; height: 22px;
  border: none; background: transparent;
  color: var(--c-text-secondary);
  cursor: pointer;
  display: none;
  align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 14px;
  transition: background 120ms, color 120ms;
}
.search-clear.visible { display: flex; }
.search-clear:hover { background: rgba(0,0,0,0.07); color: var(--c-text-primary); }

/* ─── Section ────────────────────────────────────────────────────────────── */
.tpl-section { margin-bottom: 36px; }
.tpl-section-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  margin-bottom: 10px;
  background: var(--c-surface);
  border-radius: var(--r-md);
}
.tpl-section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--c-text-secondary);
}
.tpl-section-count {
  font-size: 11px;
  color: var(--c-text-disabled);
  font-weight: 500;
}

/* ─── Grid ───────────────────────────────────────────────────────────────── */
.tpl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  align-items: start;
}

/* ─── Card ───────────────────────────────────────────────────────────────── */
.tpl-card {
  background: var(--c-surface);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow var(--t-fast), transform var(--t-fast);
}
.tpl-card:hover {
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-1px);
}

/* Header strip */
.tpl-card-strip {
  background: rgba(0,0,0,0.05);
  padding: 4px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
}
.tpl-strip-icon {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--c-text-secondary);
  flex-shrink: 0;
}
.tpl-strip-name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--c-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  line-height: 1.5;
}
.tpl-strip-badge {
  background: var(--c-primary);
  color: white;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 7px;
  border-radius: 4px;
  line-height: 1.2;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Card body */
.tpl-card-body {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tpl-body-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 0 4px;
}
.tpl-body-text { flex: 1; min-width: 0; }
.tpl-sub {
  font-size: 12px;
  color: rgba(47,51,55,0.7);
  line-height: 1.5;
}
.tpl-edited {
  font-size: 12px;
  color: rgba(47,51,55,0.3);
  line-height: 1.5;
}
.tpl-type-chip {
  background: rgba(0,0,0,0.05);
  border-radius: var(--r-pill);
  height: 32px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  font-size: 12px;
  color: var(--c-text-primary);
  white-space: nowrap;
  flex-shrink: 0;
}
.tpl-card-divider {
  height: 1px;
  background: rgba(0,0,0,0.12);
  margin: 0 4px;
  opacity: 0;
  transition: opacity 120ms;
}
.tpl-card:hover .tpl-card-divider { opacity: 1; }

/* Card footer */
.tpl-card-footer {
  padding: 0 4px 4px;
  display: flex;
  align-items: center;
}
.tpl-action-sep { flex: 1; }

.tpl-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 8px;
  border: none;
  background: transparent;
  color: var(--c-text-primary);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  white-space: nowrap;
}
.tpl-action-btn:hover { background: rgba(0,0,0,0.06); }
.tpl-action-btn i { font-size: 12px; }
.tpl-action-btn.danger { color: var(--c-danger); }
.tpl-action-btn.danger:hover { background: rgba(206,62,55,0.08); }

/* Hover-reveal actions on true-pointer devices */
@media (hover: hover) {
  .tpl-card-footer .tpl-action-btn,
  .tpl-list-row .tpl-action-btn {
    opacity: 0;
    transition: opacity var(--t-fast), background var(--t-fast);
  }
  .tpl-card:hover .tpl-card-footer .tpl-action-btn,
  .tpl-list-row:hover .tpl-action-btn { opacity: 1; }
}

/* Dev viewport: always show actions on tablet/mobile views */
body.dev-vp-tablet .tpl-card-footer .tpl-action-btn,
body.dev-vp-tablet .tpl-list-row .tpl-action-btn,
body.dev-vp-mobile .tpl-card-footer .tpl-action-btn,
body.dev-vp-mobile .tpl-list-row .tpl-action-btn { opacity: 1; }

/* ─── List view ──────────────────────────────────────────────────────────── */
.tpl-list { display: flex; flex-direction: column; gap: 2px; }
.tpl-list-row {
  background: var(--c-surface);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 12px;
  transition: background var(--t-fast);
}
.tpl-list-row:hover { background: var(--c-surface-raised); }
.tpl-list-icon {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  color: var(--c-text-secondary);
  flex-shrink: 0;
}
.tpl-list-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.tpl-list-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tpl-list-sub {
  font-size: 11.5px;
  color: rgba(47,51,55,0.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tpl-list-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.tpl-list-actions {
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
}
/* smaller badge inside list rows */
.tpl-list-name .tpl-strip-badge {
  font-size: 9px;
  padding: 2px 5px;
  line-height: 1.3;
  letter-spacing: 0.05em;
}

/* ─── Empty state ────────────────────────────────────────────────────────── */
.empty-state {
  grid-column: 1 / -1;
  padding: 36px 24px;
  text-align: center;
  color: var(--c-text-secondary);
  font-size: 13px;
  background: var(--c-surface);
  border: 1px dashed rgba(0,0,0,0.14);
  border-radius: var(--r-lg);
  line-height: 1.6;
}
.empty-state-icon {
  font-size: 28px;
  opacity: 0.3;
  display: block;
  margin-bottom: 10px;
  color: var(--c-text-primary);
}
.empty-state strong {
  display: block;
  color: var(--c-text-primary);
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

/* ─── Delete modal ───────────────────────────────────────────────────────── */
.modal-scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.42);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--ease);
}
#new-modal-scrim.open,
.modal-scrim.open {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  background: var(--c-surface);
  border-radius: 12px;
  box-shadow: var(--shadow-modal);
  padding: 28px 28px 22px;
  width: 380px;
  max-width: calc(100vw - 40px);
  transform: scale(0.96) translateY(8px);
  transition: transform 200ms var(--ease);
}
.modal-scrim.open .modal,
#new-modal-scrim.open .modal { transform: scale(1) translateY(0); }
.modal-icon {
  width: 44px; height: 44px;
  background: rgba(206,62,55,0.1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--c-danger);
  font-size: 22px;
  margin-bottom: 16px;
}
.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-text-primary);
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.modal-body {
  font-size: 13px;
  color: var(--c-text-secondary);
  line-height: 1.6;
  margin-bottom: 24px;
}
.modal-body strong { color: var(--c-text-primary); font-weight: 600; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ─── New template type picker ───────────────────────────────────────────── */
.new-tpl-modal { max-width: 540px; width: 100%; }
.type-picker-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.type-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  padding: 14px 14px 12px;
  background: var(--c-surface-raised);
  border: 1.5px solid transparent;
  border-radius: var(--r-lg);
  cursor: pointer;
  text-align: left;
  transition: border-color 120ms, background 120ms, box-shadow 120ms;
}
.type-card:hover { background: var(--c-surface); border-color: var(--c-border); }
.type-card.selected {
  background: var(--c-primary-subtle);
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(5,91,97,0.1);
}
.type-card i {
  font-size: 22px;
  color: var(--c-primary);
  margin-bottom: 2px;
}
.tc-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text-primary);
  line-height: 1.2;
}
.tc-desc {
  font-size: 11.5px;
  color: var(--c-text-secondary);
  line-height: 1.4;
}

/* ─── Toast ──────────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1a1d1f;
  color: white;
  padding: 9px 18px;
  border-radius: var(--r-lg);
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  transition: opacity 200ms, transform 200ms var(--ease);
  pointer-events: none;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<style>
#dev-bar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: #0f1117;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  padding: 5px 16px;
  font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: rgba(255,255,255,0.35); user-select: none; flex-shrink: 0;
}
#dev-bar span { font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase; }
.dev-toggle {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: 5px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.6); font-size: 11px;
  transition: background 100ms, color 100ms;
}
.dev-toggle:hover { background: rgba(255,255,255,0.12); color: #fff; }
.dev-toggle.on { background: rgba(99,179,237,0.18); border-color: rgba(99,179,237,0.4); color: #7dd3fc; }
body.dev-vp-tablet { max-width: 820px; margin: 0 auto; overflow-x: hidden; }
body.dev-vp-mobile  { max-width: 390px; margin: 0 auto; overflow-x: hidden; }
</style>
</head>
<body>

<div id="dev-bar">
  <span>Dev</span>
  <div style="width:1px;height:14px;background:rgba(255,255,255,0.15);margin:0 2px"></div>
  <button class="dev-toggle on" id="dev-vp-desktop" onclick="devViewport('desktop')">Desktop</button>
  <button class="dev-toggle" id="dev-vp-tablet" onclick="devViewport('tablet')">Tablet</button>
  <button class="dev-toggle" id="dev-vp-mobile" onclick="devViewport('mobile')">Mobile</button>
</div>

<header class="topbar">
  <span class="topbar-title">Report Templates</span>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="vt-btn active" id="vt-grid" onclick="setView('grid')" title="Grid view">
        <i class="ph ph-squares-four"></i>
      </button>
      <button class="vt-btn" id="vt-list" onclick="setView('list')" title="List view">
        <i class="ph ph-list-bullets"></i>
      </button>
    </div>
    <button class="btn btn-primary" onclick="openNewModal()">
      <i class="ph ph-plus"></i>
      New template
    </button>
  </div>
</header>

<main class="main">
  <div class="content-wrap">

    <div class="search-wrap">
      <i class="ph ph-magnifying-glass search-icon"></i>
      <input class="search-input" id="search-input" type="text" placeholder="Search templates…" oninput="onSearch(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()"><i class="ph ph-x"></i></button>
    </div>

    <div class="tpl-section">
      <div class="tpl-section-hd">
        <span class="tpl-section-title">Standard templates</span>
        <span class="tpl-section-count" id="count-default"></span>
      </div>
      <div id="grid-default"></div>
    </div>

    <div class="tpl-section">
      <div class="tpl-section-hd">
        <span class="tpl-section-title">Your templates</span>
        <span class="tpl-section-count" id="count-custom"></span>
      </div>
      <div id="grid-custom"></div>
    </div>

  </div>
</main>

<!-- New template — type picker modal -->
<div class="modal-scrim" id="new-modal-scrim" onclick="closeNewModal()">
  <div class="modal new-tpl-modal" onclick="event.stopPropagation()">
    <div class="modal-title" style="margin-bottom:4px">Choose a report type</div>
    <p class="modal-body" style="margin-bottom:20px">Each type has its own set of configurable fields.</p>
    <div class="type-picker-grid" id="type-picker-grid">
      <button class="type-card" data-type="Sales Order" onclick="selectNewType(this)">
        <i class="ph ph-receipt"></i>
        <span class="tc-name">Sales Order</span>
        <span class="tc-desc">Product &amp; labor line items, pricing, customer address</span>
      </button>
      <button class="type-card" data-type="Work Order" onclick="selectNewType(this)">
        <i class="ph ph-wrench"></i>
        <span class="tc-name">Work Order</span>
        <span class="tc-desc">Installation job sheet with measurements and labor</span>
      </button>
      <button class="type-card" data-type="Purchase Order" onclick="selectNewType(this)">
        <i class="ph ph-package"></i>
        <span class="tc-name">Purchase Order</span>
        <span class="tc-desc">Vendor order with item quantities and pricing</span>
      </button>
      <button class="type-card" data-type="Tags" onclick="selectNewType(this)">
        <i class="ph ph-tag"></i>
        <span class="tc-name">Tags</span>
        <span class="tc-desc">Product and material labels for warehouse use</span>
      </button>
    </div>
    <div class="modal-actions" style="margin-top:24px">
      <button class="btn btn-outline" onclick="closeNewModal()">Cancel</button>
      <button class="btn btn-primary" id="new-modal-confirm" onclick="confirmNewType()" disabled>Create template</button>
    </div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-scrim" id="modal-scrim">
  <div class="modal">
    <div class="modal-icon"><i class="ph ph-trash"></i></div>
    <div class="modal-title">Delete template?</div>
    <p class="modal-body">
      <strong id="modal-tpl-name"></strong> will be permanently removed and cannot be recovered.
    </p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── Data ─────────────────────────────────────────────────────────────────── */
const DEFAULT_TEMPLATES = [
  { id: 'sales-order',    name: 'Proposal / SO', type: 'Sales Order',    isDefault: true, desc: 'Standard sales order with product and labor line items' },
  { id: 'work-order',     name: 'Install WO',    type: 'Work Order',     isDefault: true, desc: 'Field work order with job details and labor tracking' },
  { id: 'purchase-order', name: 'Vendor PO',     type: 'Purchase Order', isDefault: true, desc: 'Vendor purchase order with item quantities and pricing' },
  { id: 'tags',           name: 'Inventory Tags',          type: 'Tags',           isDefault: true, desc: 'Product and material tags for warehouse and job site use' },
];

const STORAGE_KEY = 'qfx_custom_templates';
function loadTemplates() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveTemplates() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(customTemplates)); } catch {}
}

let customTemplates = loadTemplates();

/* ── View mode ────────────────────────────────────────────────────────────── */
let viewMode = 'grid';

function setView(v) {
  viewMode = v;
  document.getElementById('vt-grid').classList.toggle('active', v === 'grid');
  document.getElementById('vt-list').classList.toggle('active', v === 'list');
  render();
}

/* ── Search ───────────────────────────────────────────────────────────────── */
let searchQuery = '';

function onSearch(val) {
  searchQuery = val.trim().toLowerCase();
  document.getElementById('search-clear').classList.toggle('visible', val.length > 0);
  render();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  render();
}

function matches(t) {
  if (!searchQuery) return true;
  return t.name.toLowerCase().includes(searchQuery) ||
         t.type.toLowerCase().includes(searchQuery) ||
         (t.desc       && t.desc.toLowerCase().includes(searchQuery)) ||
         (t.basedOnName && t.basedOnName.toLowerCase().includes(searchQuery));
}

/* ── Render ───────────────────────────────────────────────────────────────── */
function render() {
  const dContainer = document.getElementById('grid-default');
  const cContainer = document.getElementById('grid-custom');
  const filteredDefault = DEFAULT_TEMPLATES.filter(matches);
  const filteredCustom  = customTemplates.filter(matches);

  document.getElementById('count-default').textContent = filteredDefault.length || '';
  document.getElementById('count-custom').textContent  = filteredCustom.length  || '';

  dContainer.className = viewMode === 'grid' ? 'tpl-grid' : 'tpl-list';
  cContainer.className = viewMode === 'grid' ? 'tpl-grid' : 'tpl-list';

  if (filteredDefault.length) {
    dContainer.innerHTML = filteredDefault.map(t =>
      viewMode === 'grid' ? renderDefaultCard(t) : renderDefaultListRow(t)
    ).join('');
  } else {
    dContainer.innerHTML = emptyHtml('No matches', 'Try a different search term.', 'ph-magnifying-glass');
  }

  if (customTemplates.length === 0) {
    cContainer.innerHTML = emptyHtml('No custom templates yet', 'Clone a default template or create a new one to get started.', 'ph-folder-open');
    return;
  }

  if (filteredCustom.length) {
    cContainer.innerHTML = filteredCustom.map(t =>
      viewMode === 'grid' ? renderCustomCard(t) : renderCustomListRow(t)
    ).join('');
  } else {
    cContainer.innerHTML = emptyHtml('No matches', 'Try a different search term.', 'ph-magnifying-glass');
  }
}

/* ── Card renderers ───────────────────────────────────────────────────────── */
function renderDefaultCard(t) {
  return `
  <div class="tpl-card">
    <div class="tpl-card-strip">
      <div class="tpl-strip-icon"><i class="ph ph-file-text"></i></div>
      <span class="tpl-strip-name">${escHtml(t.name)}</span>
      ${t.isDefault && !hasCustomDefault(t.type) ? '<span class="tpl-strip-badge">Default</span>' : ''}
    </div>
    <div class="tpl-card-body">
      <div class="tpl-body-row">
        <div class="tpl-body-text"><div class="tpl-sub">${truncDesc(t.desc)}</div></div>
        <div class="tpl-type-chip">${escHtml(t.type)}</div>
      </div>
      <div class="tpl-card-divider"></div>
      <div class="tpl-card-footer">
        <button class="tpl-action-btn" onclick="viewTemplate('${t.id}')">
          <i class="ph ph-eye"></i> View
        </button>
        <button class="tpl-action-btn" onclick="cloneTemplate('${t.id}', true)">
          <i class="ph ph-copy"></i> Clone
        </button>
      </div>
    </div>
  </div>`;
}

function renderCustomCard(t) {
  return `
  <div class="tpl-card">
    <div class="tpl-card-strip">
      <div class="tpl-strip-icon"><i class="ph ph-file-text"></i></div>
      <span class="tpl-strip-name">${escHtml(t.name)}</span>
      ${t.isOrgDefault ? '<span class="tpl-strip-badge">Default</span>' : ''}
    </div>
    <div class="tpl-card-body">
      <div class="tpl-body-row">
        <div class="tpl-body-text">
          <div class="tpl-sub">${t.desc ? truncDesc(t.desc) : 'Based on ' + escHtml(t.basedOnName)}</div>
          <div class="tpl-edited">${editedLabel(t.daysAgo)}</div>
        </div>
        <div class="tpl-type-chip">${escHtml(t.type)}</div>
      </div>
      <div class="tpl-card-divider"></div>
      <div class="tpl-card-footer">
        <button class="tpl-action-btn" onclick="editTemplate('${t.id}')">
          <i class="ph ph-pencil-simple"></i> Edit
        </button>
        <button class="tpl-action-btn" onclick="cloneTemplate('${t.id}', false)">
          <i class="ph ph-copy"></i> Clone
        </button>
        <div class="tpl-action-sep"></div>
        <button class="tpl-action-btn danger" onclick="deleteTemplate('${t.id}')">
          <i class="ph ph-trash"></i> Remove
        </button>
      </div>
    </div>
  </div>`;
}

/* ── List row renderers ────────────────────────────────────────────────────── */
function renderDefaultListRow(t) {
  return `
  <div class="tpl-list-row">
    <div class="tpl-list-icon"><i class="ph ph-file-text"></i></div>
    <div class="tpl-list-main">
      <div class="tpl-list-name">
        ${escHtml(t.name)}
        ${t.isDefault && !hasCustomDefault(t.type) ? '<span class="tpl-strip-badge">Default</span>' : ''}
      </div>
      <div class="tpl-list-sub">${truncDesc(t.desc)}</div>
    </div>
    <div class="tpl-list-meta">
      <div class="tpl-type-chip">${escHtml(t.type)}</div>
    </div>
    <div class="tpl-list-actions">
      <button class="tpl-action-btn" onclick="viewTemplate('${t.id}')"><i class="ph ph-eye"></i> View</button>
      <button class="tpl-action-btn" onclick="cloneTemplate('${t.id}', true)"><i class="ph ph-copy"></i> Clone</button>
    </div>
  </div>`;
}

function renderCustomListRow(t) {
  return `
  <div class="tpl-list-row">
    <div class="tpl-list-icon"><i class="ph ph-file-text"></i></div>
    <div class="tpl-list-main">
      <div class="tpl-list-name">
        ${escHtml(t.name)}
        ${t.isOrgDefault ? '<span class="tpl-strip-badge">Default</span>' : ''}
      </div>
      <div class="tpl-list-sub">Based on ${escHtml(t.basedOnName)} &middot; ${editedLabel(t.daysAgo)}</div>
    </div>
    <div class="tpl-list-meta">
      <div class="tpl-type-chip">${escHtml(t.type)}</div>
    </div>
    <div class="tpl-list-actions">
      <button class="tpl-action-btn" onclick="editTemplate('${t.id}')"><i class="ph ph-pencil-simple"></i> Edit</button>
      <button class="tpl-action-btn" onclick="cloneTemplate('${t.id}', false)"><i class="ph ph-copy"></i> Clone</button>
      <button class="tpl-action-btn danger" onclick="deleteTemplate('${t.id}')"><i class="ph ph-trash"></i> Remove</button>
    </div>
  </div>`;
}

function emptyHtml(title, body, icon) {
  return `<div class="empty-state"><i class="ph ${icon} empty-state-icon"></i><strong>${escHtml(title)}</strong>${escHtml(body)}</div>`;
}

function editedLabel(daysAgo) {
  if (daysAgo === 0) return 'Edited today';
  if (daysAgo === 1) return 'Edited yesterday';
  return `Edited ${daysAgo} days ago`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const DESC_CAP = 110;
function truncDesc(s) {
  if (!s) return '';
  const str = String(s);
  return str.length > DESC_CAP ? escHtml(str.slice(0, DESC_CAP).trimEnd()) + '…' : escHtml(str);
}

/* ── Actions ─────────────────────────────────────────────────────────────── */
function cloneTemplate(id, isDefault) {
  const source = isDefault
    ? DEFAULT_TEMPLATES.find(t => t.id === id)
    : customTemplates.find(t => t.id === id);
  if (!source) return;

  const cloneName        = 'Copy of ' + source.name;
  const cloneBasedOn     = isDefault ? source.id       : source.basedOn;
  const cloneBasedOnName = isDefault ? source.name     : source.basedOnName;
  const cloneDesc        = source.desc || '';

  customTemplates.unshift({
    id: 'c' + Date.now(),
    name: cloneName,
    desc: cloneDesc,
    type: source.type,
    basedOn: cloneBasedOn,
    basedOnName: cloneBasedOnName,
    daysAgo: 0,
    isOrgDefault: false,
  });

  saveTemplates();
  render();
  const newId = customTemplates[0].id;
  showToast('Template cloned — opening editor…');
  setTimeout(() => openEditor('clone', { name: cloneName, desc: cloneDesc, basedOn: cloneBasedOn, type: source.type, id: newId }), 700);
}

function editTemplate(id) {
  const t = customTemplates.find(t => t.id === id);
  if (t) openEditor('edit', { name: t.name, desc: t.desc, basedOn: t.basedOn, type: t.type, id: t.id, isDefault: t.isOrgDefault });
}

let pendingDeleteId = null;

function deleteTemplate(id) {
  const t = customTemplates.find(t => t.id === id);
  if (!t) return;
  pendingDeleteId = id;
  document.getElementById('modal-tpl-name').textContent = t.name;
  document.getElementById('modal-scrim').classList.add('open');
}

function confirmDelete() {
  customTemplates = customTemplates.filter(t => t.id !== pendingDeleteId);
  pendingDeleteId = null;
  saveTemplates();
  closeModal();
  render();
  showToast('Template deleted');
}

function closeModal() {
  document.getElementById('modal-scrim').classList.remove('open');
}

/* ── Navigate to editor ──────────────────────────────────────────────────── */
function viewTemplate(id) {
  const t = DEFAULT_TEMPLATES.find(t => t.id === id);
  if (t) openEditor('view', { name: t.name, desc: t.desc, basedOnName: t.basedOnName, basedOn: t.id, type: t.type, isDefault: !hasCustomDefault(t.type) });
}

function openEditor(mode, params = {}) {
  const url = new URL('report-settings.html', window.location.href);
  url.searchParams.set('mode', mode);
  if (params.name)        url.searchParams.set('tplName', params.name);
  if (params.desc)        url.searchParams.set('desc', params.desc);
  if (params.basedOnName) url.searchParams.set('basedOnName', params.basedOnName);
  if (params.basedOn)     url.searchParams.set('basedOn', params.basedOn);
  if (params.type)    url.searchParams.set('type', params.type);
  if (params.id)        url.searchParams.set('tplId', params.id);
  if (params.isDefault) url.searchParams.set('isDefault', '1');
  if (mode === 'clone') url.searchParams.set('lockBasedOn', '1');
  window.location.href = url.toString();
}

/* ── New template type picker ────────────────────────────────────────────── */
let selectedNewType = null;

function openNewModal() {
  selectedNewType = null;
  document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('new-modal-confirm').disabled = true;
  document.getElementById('new-modal-scrim').classList.add('open');
}

function closeNewModal() {
  document.getElementById('new-modal-scrim').classList.remove('open');
}

function selectNewType(el) {
  document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedNewType = el.dataset.type;
  document.getElementById('new-modal-confirm').disabled = false;
}

function confirmNewType() {
  if (!selectedNewType) return;
  closeNewModal();
  openEditor('new', { type: selectedNewType });
}

/* ── Per-type default enforcement ───────────────────────────────────────── */
function hasCustomDefault(type) {
  return customTemplates.some(t => t.type === type && t.isOrgDefault);
}

function setOrgDefault(id) {
  const t = customTemplates.find(t => t.id === id);
  if (!t) return;
  // Clear existing default for same type
  customTemplates.forEach(c => {
    if (c.type === t.type) c.isOrgDefault = false;
  });
  t.isOrgDefault = true;
  render();
  showToast(`"${t.name}" set as default ${t.type}`);
}

/* ── Toast ───────────────────────────────────────────────────────────────── */
function showToast(msg, icon = 'ph-check-circle') {
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="ph ${icon}"></i>${msg}`;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ── Init ────────────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  render();

  const params    = new URLSearchParams(window.location.search);
  const saved     = params.get('saved');
  const tplId     = params.get('tplId');
  const isDefault = params.get('isDefault') === '1';
  const savedDesc = params.get('desc') ?? null;
  if (tplId) {
    const t = customTemplates.find(t => t.id === tplId);
    if (t) {
      if (saved) t.name = saved;
      if (savedDesc !== null) t.desc = savedDesc;
      t.daysAgo = 0;
      if (isDefault) {
        customTemplates.forEach(c => { if (c.type === t.type) c.isOrgDefault = false; });
        t.isOrgDefault = true;
      } else {
        t.isOrgDefault = false;
      }
      saveTemplates();
      render();
    }
  }
  if (saved) showToast(`"${saved}" saved`);

  document.getElementById('modal-scrim').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>

<script>
function devViewport(vp) {
  document.body.classList.remove('dev-vp-tablet', 'dev-vp-mobile');
  if (vp === 'tablet') document.body.classList.add('dev-vp-tablet');
  if (vp === 'mobile') document.body.classList.add('dev-vp-mobile');
  ['desktop','tablet','mobile'].forEach(v => {
    document.getElementById('dev-vp-' + v)?.classList.toggle('on', v === vp);
  });
}
</script>
</body>
</html>
