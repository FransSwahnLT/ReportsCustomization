  }).join('');
}

function buildLockedColsHTML(pool) {
  const poolMap = Object.fromEntries(pool.map(c => [c.key, c]));
  const renderSimpleCb = key => {
    const def = poolMap[key]; if (!def) return '';
    const checked = activeColumns.includes(key);
    return `<label class="cb-row" data-field="${key}">
      <input type="checkbox" class="check-box" ${checked ? 'checked' : ''}
             onchange="lockedColToggle('${key}',this.checked)">
      <span class="cb-label-text">${def.hdr}</span>
    </label>`;
  };
  const leftHTML = [...SO_COL_LOCKED_LEFT].map(renderSimpleCb).join('');

  return `
    <div class="cb-subsection">
      <div class="cb-subsection-label">Line number</div>
      <div class="cb-grid">${leftHTML}</div>
    </div>`;
}

function lockedColToggle(key, checked) {
  if (checked) {
    if (!activeColumns.includes(key)) activeColumns.push(key);
    _enforceSOLockedPositions();
  } else {
    activeColumns = activeColumns.filter(k => k !== key);
  }
  renderColPicker();
  updateAllBadges();
  refreshPreviewImmediate();
}

/* ── Column picker render + interactions ─────────────────────────────────── */
function renderColPicker() {
  const pool  = TYPE_CONFIG[activeType]?.colPool || [];
  const invEl = document.getElementById('cp-inventory');
  const actEl = document.getElementById('cp-active');
  const cntEl = document.getElementById('cp-count');
  if (!invEl || !actEl) return;

  // Render locked cols as separate checkboxes outside the picker panels
  const lockedColsEl = document.getElementById('cp-locked-cols');
  if (lockedColsEl) lockedColsEl.innerHTML = buildLockedColsHTML(pool);

  // Locked cols don't appear in either picker panel
  const inventory = pool.filter(c => !activeColumns.includes(c.key) && !_isSoLocked(c.key));
  const active    = activeColumns.filter(k => !_isSoLocked(k)).map(k => pool.find(c => c.key === k)).filter(Boolean);

  invEl.innerHTML = inventory.length
    ? inventory.map(c => `
        <div class="cp-inv-item" data-key="${c.key}" draggable="true"
             onmouseenter="colHoverIn('${c.key}')"
             onmouseleave="colHoverOut()"
             ondragstart="cpInvDragStart(event,'${c.key}')"
             ondragend="cpDragEnd()">
          <i class="ph ph-dots-six-vertical cp-handle" style="font-size:15px;"></i>
          <span>${c.key}</span>
        </div>`).join('')
    : `<div class="cp-empty">All columns active</div>`;

  const defaultPct = key => Math.round(100 / Math.max(1, activeColumns.length));
  actEl.innerHTML = active.length
    ? active.map(c => `
        <div class="cp-active-item${colWidths[c.key] != null ? ' cp-has-width' : ''}" data-key="${c.key}"
             ondragover="cpItemDragOver(event,'${c.key}')"
             ondrop="cpItemDrop(event,'${c.key}')"
             ondragleave="cpItemDragLeave(event)"
             ondragend="cpDragEnd()">
          <div class="cp-item-top" draggable="true" ondragstart="cpDragStart(event,'${c.key}')">
            <i class="ph ph-dots-six-vertical cp-handle"></i>
            <span class="cp-col-label">${c.key}</span>
            ${!c.subRow ? `<label class="cp-width-check-wrap">
              <input type="checkbox" class="cp-width-check" ${colWidths[c.key] != null ? 'checked' : ''}
                     onchange="cpWidthToggle(event,'${c.key}')">
              <i class="ph ph-arrows-left-right cp-width-check-lbl"></i>
            </label>` : ''}
            <button class="cp-remove-btn" onclick="colDeactivate('${c.key}',event)" title="Remove">
              <i class="ph ph-x"></i>
            </button>
          </div>
          ${!c.subRow ? `<div class="cp-width-row">
            <input type="range" class="cp-width-slider" min="20" max="300"
                   value="${colWidths[c.key] ?? autoFitWidths[c.key] ?? (parseInt(c.w) || 80)}"
                   oninput="cpWidthChange('${c.key}', this.value)">
          </div>` : ''}
        </div>`).join('')
    : `<div class="cp-empty">Add columns from the left</div>`;

  if (cntEl) cntEl.textContent = activeColumns.length;

  // Pixel fit indicator — rendered below both col-picker panels
  const cpWrap = document.getElementById('col-picker-wrap');
  document.querySelectorAll('.cp-fit-wrap').forEach(el => el.remove());
  if (active.length > 0 && cpWrap) {
    const totalW     = getTableWidth();
    const printWidth = getPrintWidth();
    const overage    = totalW - printWidth;
    const pct        = Math.min(100, (totalW / printWidth) * 100);

    const overagePct = Math.round((overage / printWidth) * 100);
    const barColor  = overage <= 0 ? '#22c55e' : overagePct <= 15 ? '#f59e0b' : '#ef4444';
    const textColor = overage <= 0 ? '#166534' : overagePct <= 15 ? '#92400e' : '#7f1d1d';
    const bgColor   = overage <= 0 ? '#dcfce7' : overagePct <= 15 ? '#fef3c7' : '#fee2e2';

    const fitMsg = overage <= 0
      ? `Table fits &mdash; ${Math.round((totalW / printWidth) * 100)}% of page width`
      : `Table is ${overagePct}% too wide`;

    const landscapeBtn = (overage > 0 && pageOrientation === 'portrait')
      ? `<button class="cp-cta-btn" onclick="setOrientation('landscape')"><i class="ph ph-device-rotate"></i> Landscape +${PRINT_WIDTHS.landscape - PRINT_WIDTHS.portrait}px</button>`
      : '';
    const autoFitBtn = overage > 0
      ? `<button class="cp-cta-btn cp-cta-strong" onclick="cpAutoFit()">Auto Fit columns</button>`
      : '';
    const shrinkBtn = (overage > 0 && !tableAdaptiveText)
      ? `<button class="cp-cta-btn" onclick="cpShrinkText()"><i class="ph ph-text-aa"></i> Shrink text to fit</button>`
      : (overage > 0 && tableAdaptiveText)
      ? `<button class="cp-cta-btn cp-cta-active" onclick="tableAdaptiveChange(false)"><i class="ph ph-text-aa"></i> Text scaled — reset</button>`
      : '';

    const ctaStack = (landscapeBtn || autoFitBtn || shrinkBtn)
      ? `<div class="cp-cta-stack">${landscapeBtn}${shrinkBtn}${autoFitBtn}</div>` : '';

    const indicatorHTML = `<div class="cp-fit-wrap" style="background:${bgColor};color:${textColor}">
      <div class="cp-fit-bar-track"><div class="cp-fit-bar-fill" style="width:${pct.toFixed(1)}%;background:${barColor}"></div></div>
      <div class="cp-fit-row"><span class="cp-fit-msg">${fitMsg}</span>${ctaStack}</div>
    </div>`;
    cpWrap.insertAdjacentHTML('afterend', indicatorHTML);
  }

  // Touch long-press → peek (tablet / mobile)
  invEl.querySelectorAll('.cp-inv-item').forEach(item => {
    const key = item.dataset.key;
    item.addEventListener('touchstart', () => {
      peekTimer = setTimeout(() => showPeek(null, key), 480);
    }, { passive: true });
    item.addEventListener('touchmove',   () => { if (peekTimer) { clearTimeout(peekTimer); peekTimer = null; } }, { passive: true });
    item.addEventListener('touchend',    hidePeek, { passive: true });
    item.addEventListener('touchcancel', hidePeek, { passive: true });
  });
  actEl.querySelectorAll('.cp-active-item').forEach(item => {
    const key = item.dataset.key;
    item.addEventListener('touchstart', () => {
      peekTimer = setTimeout(() => showPeek(null, key), 480);
    }, { passive: true });
    item.addEventListener('touchmove',   () => { if (peekTimer) { clearTimeout(peekTimer); peekTimer = null; } }, { passive: true });
    item.addEventListener('touchend',    hidePeek, { passive: true });
    item.addEventListener('touchcancel', hidePeek, { passive: true });
  });

  // Re-mount field editor for SO paired cols (rendered inside locked cols panel)
  const soSecLines = (TYPE_CONFIG[activeType]?.sections || []).find(s => s.id === 'sec-lines' && s.fieldEditor);
  if (soSecLines) mountFieldEditor(soSecLines);
}

function colActivate(key) {

function colDeactivate(key, e) {

function cpWidthToggle(e, key) {
  e.stopPropagation();

    const poolDef = (TYPE_CONFIG[activeType]?.colPool || []).find(c => c.key === key);
    colWidths[key] = autoFitWidths[key] ?? parseInt(poolDef?.w) ?? 80;
    delete autoFitWidths[key];
  } else {
    delete colWidths[key];
    delete autoFitWidths[key];
    // Re-fit remaining columns if auto-fit is still active for any of them
    if (Object.keys(autoFitWidths).length > 0) _applyAutoFit();
  }

function cpWidthChange(key, val) {

function getTableWidth() {
  const pool = TYPE_CONFIG[activeType]?.colPool || [];
  const poolMap = Object.fromEntries(pool.map(c => [c.key, c]));
  return activeColumns
    .filter(k => poolMap[k] && !poolMap[k].subRow)
    .reduce((s, k) => s + (colWidths[k] ?? autoFitWidths[k] ?? (parseInt(poolMap[k].w) || 0)), 0);
}

let userZoomOverride = null; // null = auto-fit
const ZOOM_STEPS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];

// Enable/disable toolbar + line picker when preview renders or clears
function setPreviewReady(ready) {
  const toolbar = document.querySelector('.preview-toolbar');
  if (toolbar) toolbar.classList.toggle('toolbar-loading', !ready);
  if (ready) {
    // Line picker fades in 1000ms after preview appears
    setTimeout(() => {
      const picker = document.getElementById('preview-line-picker');
      if (picker) picker.style.opacity = '1';
    }, 1000);
    updateZoomLimits();
  }
}

// Disable zoom-in/out buttons when at the step boundary
function updateZoomLimits() {
  const shell   = document.getElementById('doc-shell');
  const scrollEl = shell?.closest('.preview-scroll');
  const baseW   = pageOrientation === 'landscape' ? 960 : 700;
  const availW  = scrollEl ? scrollEl.clientWidth - 56 : baseW;
  const fitZ    = availW / baseW;
  const cur     = userZoomOverride !== null ? userZoomOverride : fitZ;
  const btnOut  = document.querySelector('.ptb-btn[title="Zoom out"]');
  const btnIn   = document.querySelector('.ptb-btn[title="Zoom in"]');
  if (btnOut) btnOut.disabled = !ZOOM_STEPS.some(z => z < cur - 0.01);
  if (btnIn)  btnIn.disabled  = !ZOOM_STEPS.some(z => z > cur + 0.01);
}

function updatePreviewZoom() {
  const shell = document.getElementById('doc-shell');
  if (!shell) return;
  if (pageOrientation === 'landscape') {
    shell.style.width = '960px';
  } else {
    shell.style.width = '';
  }
  const scrollEl = shell.closest('.preview-scroll');
  const baseW  = pageOrientation === 'landscape' ? 960 : 700;
  const availW = scrollEl ? scrollEl.clientWidth - 56 : baseW;
  const fitZ   = availW / baseW;
  const z      = userZoomOverride !== null ? userZoomOverride : fitZ;
  shell.style.zoom = (z > 0.995 && z < 1.005) ? '' : z.toFixed(3);
  const label = document.getElementById('zoom-label');
  if (label) label.textContent = Math.round(z * 100) + '%';
  updateZoomLimits();
}

function zoomStep(dir) {
  const shell = document.getElementById('doc-shell');
  const scrollEl = shell?.closest('.preview-scroll');
  const baseW  = pageOrientation === 'landscape' ? 960 : 700;
  const availW = scrollEl ? scrollEl.clientWidth - 56 : baseW;
  const fitZ   = availW / baseW;
  const cur    = userZoomOverride !== null ? userZoomOverride : fitZ;
  if (dir > 0) {
    const next = ZOOM_STEPS.find(z => z > cur + 0.01);
    if (next) { userZoomOverride = next; updatePreviewZoom(); }
  } else {
    const prev = [...ZOOM_STEPS].reverse().find(z => z < cur - 0.01);
    if (prev) { userZoomOverride = prev; updatePreviewZoom(); }
  }
}

function zoomFit() {
  userZoomOverride = null;
  updatePreviewZoom();
}

function zoomReset() {
  userZoomOverride = 1;
  updatePreviewZoom();
}

function togglePreviewFullscreen() {
  const panel = document.querySelector('.preview-panel');
  if (!panel) return;
  if (!document.fullscreenElement) {
    panel.requestFullscreen?.().then(() => {
      requestAnimationFrame(() => updatePreviewZoom());
    }).catch(() => {});
  } else {
    document.exitFullscreen?.();
  }
}

// Page counter: which page is ≥66% visible in the scroll viewport?
function updatePageCounter() {
  const scrollEl = document.querySelector('.preview-scroll');
  const pages    = [...document.querySelectorAll('#preview-doc .preview-page')];
  const label    = document.getElementById('page-label');
  if (!label) return;
  if (!pages.length) { label.textContent = '1 / 1'; return; }

  const total    = pages.length;
  const sRect    = scrollEl?.getBoundingClientRect() || { top: 0, bottom: window.innerHeight };
  let current = 1, bestFrac = -1;

  pages.forEach((page, i) => {
    const r     = page.getBoundingClientRect();
    const pageH = r.height;
    if (!pageH) return;
    const visTop  = Math.max(r.top,    sRect.top);
    const visBot  = Math.min(r.bottom, sRect.bottom);
    const visFrac = Math.max(0, visBot - visTop) / pageH;
    if (visFrac >= 0.66) {
      if (visFrac > bestFrac) { bestFrac = visFrac; current = i + 1; }
    } else if (bestFrac < 0.66 && visFrac > bestFrac) {
      bestFrac = visFrac; current = i + 1;
    }
  });

  label.textContent = `${current} / ${total}`;
}

function setOrientation(o) {
  pageOrientation = o;
  // Sync toggle UI
  document.querySelectorAll('#orientation-toggle .toggle-slider-opt').forEach(el => {

// Core fit logic — scales non-manual columns to fill printW exactly.
// Manual (colWidths) columns are held fixed; only autoFitWidths are written.
function _applyAutoFit() {
  const pool = TYPE_CONFIG[activeType]?.colPool || [];
  const poolMap = Object.fromEntries(pool.map(c => [c.key, c]));
  const cols = activeColumns.filter(k => poolMap[k] && !poolMap[k].subRow);
  const printW = getPrintWidth();
  // Starting width: manual override if set, else pool default
  const starts = cols.map(k => ({ k, w: colWidths[k] ?? (parseInt(poolMap[k].w) || 0), manual: colWidths[k] != null }));
  const total = starts.reduce((s, c) => s + c.w, 0);
  if (total <= printW) { autoFitWidths = {}; return; }
  const scale = printW / total;
  const scaled = starts.map(({ k, w, manual }) => ({ k, manual, w: Math.max(20, Math.round(w * scale)) }));
  // Shave rounding excess from widest non-manual columns
  let excess = scaled.reduce((s, c) => s + c.w, 0) - printW;
  if (excess > 0) {
    scaled.filter(c => !c.manual).slice().sort((a, b) => b.w - a.w).forEach(c => {
      if (excess <= 0) return;
      const shave = Math.min(excess, c.w - 20);
      c.w -= shave; excess -= shave;
    });
  }
  autoFitWidths = {};
  scaled.forEach(({ k, w, manual }) => { if (!manual) autoFitWidths[k] = w; });
}

function cpAutoFit() {
  _applyAutoFit();
  renderColPicker();
  refreshPreviewImmediate();
}

/* ── Column picker drag-and-drop (bi-directional) ───────────────────────── */

// Drag start: item from ACTIVE panel
function cpDragStart(e, key) {
  cpDragKey    = key;
  cpDragSource = 'active';
  e.dataTransfer.effectAllowed = 'move';
  // Drag initiated from .cp-item-top — mark and ghost the full .cp-active-item
  const item = e.currentTarget.closest('.cp-active-item') || e.currentTarget;
  item.classList.add('cp-dragging');
  e.dataTransfer.setDragImage(item, e.offsetX, e.offsetY);
  document.getElementById('col-picker-wrap')?.classList.add('cp-dragging-active');
  requestAnimationFrame(() => { item.style.opacity = '1'; });
}

// Drag start: item from INVENTORY panel
function cpInvDragStart(e, key) {
  cpDragKey    = key;
  cpDragSource = 'inventory';
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('cp-dragging');
  colHoverOut(); // clear ghost while dragging
  document.getElementById('col-picker-wrap')?.classList.add('cp-dragging-active');
  const el = e.currentTarget;
  requestAnimationFrame(() => { el.style.opacity = '1'; });
}

// Drag end — reset all state and highlights
function cpDragEnd() {
  cpDragSource  = null;
  cpDragKey     = null;
  cpDragOverKey = null;
  document.querySelectorAll('.cp-active-item, .cp-inv-item').forEach(el => {
    el.classList.remove('cp-dragging','cp-drop-above','cp-drop-below');
    el.style.opacity = '';
  });
  document.getElementById('cp-active')?.closest('.col-picker-panel')?.classList.remove('cp-panel-over');
  document.getElementById('cp-inventory')?.closest('.col-picker-panel')?.classList.remove('cp-panel-over');
  document.getElementById('col-picker-wrap')?.classList.remove('cp-dragging-active');
  cpStopAutoScroll();
}

// Dragover an active item — show insertion marker (works for both sources)
function cpItemDragOver(e, key) {
  if (!cpDragKey || cpDragKey === key) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  cpDragOverKey = key;
  document.querySelectorAll('.cp-active-item').forEach(el => el.classList.remove('cp-drop-above','cp-drop-below'));
  const rect = e.currentTarget.getBoundingClientRect();
  const isAbove = e.clientY < rect.top + rect.height / 2;
  e.currentTarget.classList.add(isAbove ? 'cp-drop-above' : 'cp-drop-below');
  cpUpdateAutoScroll(e);
}

function cpItemDragLeave(e) {
  e.currentTarget.classList.remove('cp-drop-above','cp-drop-below');
}

// Drop ON an active item — insert at that position (both sources)
function cpItemDrop(e, targetKey) {
  e.preventDefault();
  if (!cpDragKey || cpDragKey === targetKey) return;

  const rect  = e.currentTarget.getBoundingClientRect();
  const after = e.clientY >= rect.top + rect.height / 2;
  let toIdx   = activeColumns.indexOf(targetKey);
  if (after) toIdx++;

  if (cpDragSource === 'inventory') {
    // Inventory → Active: insert at position
    activeColumns.splice(toIdx, 0, cpDragKey);
  } else {
    // Active → Active: reorder
    const fromIdx = activeColumns.indexOf(cpDragKey);
    if (fromIdx < toIdx) toIdx--;
    activeColumns.splice(fromIdx, 1);
    activeColumns.splice(toIdx, 0, cpDragKey);
  }

  _enforceSOLockedPositions();
  cpDragKey = null; cpDragOverKey = null;
  renderColPicker();
  updateAllBadges();
  refreshPreviewImmediate();
}

// Dragover active panel background (empty area) — only accept inventory→active
function cpListDragOver(e) {
  if (!cpDragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('cp-active')?.closest('.col-picker-panel')?.classList.add('cp-panel-over');
  cpUpdateAutoScroll(e);
}

function cpListDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    document.getElementById('cp-active')?.closest('.col-picker-panel')?.classList.remove('cp-panel-over');
    cpStopAutoScroll();
  }
}

function cpUpdateAutoScroll(e) {
  const el = document.getElementById('cp-active');
  if (!el) return;
  const ZONE = 44;
  const rect = el.getBoundingClientRect();
  if (e.clientY < rect.top + ZONE) {
    cpScrollDir = -1;
    cpStartAutoScroll(el);
  } else if (e.clientY > rect.bottom - ZONE) {
    cpScrollDir = 1;
    cpStartAutoScroll(el);
  } else {
    cpStopAutoScroll();
  }
}

function cpStartAutoScroll(el) {
  if (cpScrollRAF) return;
  (function step() {
    if (cpScrollDir !== 0) { el.scrollTop += cpScrollDir * 5; }
    cpScrollRAF = requestAnimationFrame(step);
  })();
}

function cpStopAutoScroll() {
  if (cpScrollRAF) { cancelAnimationFrame(cpScrollRAF); cpScrollRAF = null; }
  cpScrollDir = 0;
}

// Drop on active panel background — append (inventory) or no-op (already active)
function cpListDrop(e) {
  e.preventDefault();
  document.getElementById('cp-active')?.closest('.col-picker-panel')?.classList.remove('cp-panel-over');
  if (!cpDragKey) return;
  if (cpDragSource === 'inventory' && !activeColumns.includes(cpDragKey)) {
    activeColumns.push(cpDragKey);
    _enforceSOLockedPositions();
    renderColPicker();
    updateAllBadges();
    refreshPreviewImmediate();
  }
  cpDragKey = null;
}

// Dragover INVENTORY panel — accept active→inventory (to deactivate)
function cpInvPanelDragOver(e) {
  if (!cpDragKey || cpDragSource !== 'active') return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('cp-inventory')?.closest('.col-picker-panel')?.classList.add('cp-panel-over');
}

function cpInvPanelDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    document.getElementById('cp-inventory')?.closest('.col-picker-panel')?.classList.remove('cp-panel-over');
  }
}

// Drop on inventory panel — deactivate column (active→inventory)
function cpInvPanelDrop(e) {
  e.preventDefault();
  document.getElementById('cp-inventory')?.closest('.col-picker-panel')?.classList.remove('cp-panel-over');
  if (!cpDragKey || cpDragSource !== 'active') { cpDragKey = null; return; }
  if (_isSoLocked(cpDragKey)) { cpDragKey = null; return; } // locked cols can't be deactivated
  activeColumns = activeColumns.filter(k => k !== cpDragKey);
  cpDragKey = null;
  renderColPicker();
  updateAllBadges();
  refreshPreviewImmediate();
}

/* ── Mobile hold-to-peek ─────────────────────────────────────────────────── */
let peekTimer  = null;
let peekActive = false;

function showPeek(ghostField, ghostCol) {
  peekActive = true;
  if (ghostField) previewGhostField = ghostField;
  if (ghostCol)   colGhostKey = ghostCol;

  const peekBar = document.getElementById('peek-bar');
  const doc     = document.getElementById('peek-doc');
  const wrap    = document.querySelector('.peek-doc-wrap');
  if (!peekBar || !doc || !wrap) return;

  // Size bar: 3:2, flush below workspace
  const wsEl  = document.querySelector('.workspace');
  const wsTop = wsEl ? wsEl.getBoundingClientRect().top : 52;
  const barW  = window.innerWidth;
  const barH  = Math.round(barW * 2 / 3);
  peekBar.style.top    = wsTop + 'px';
  peekBar.style.height = barH + 'px';

  const docW = pageOrientation === 'landscape' ? 960 : 700;
  wrap.style.width      = docW + 'px';
  wrap.style.transition = 'none';

  // Start with a fit-to-width transform so the bar is never blank
  const sFit = barW / docW;
  wrap.style.transform = `translate(0,0) scale(${sFit})`;

  // Render content and show bar
  doc.innerHTML = buildPreviewHTML();

  peekBar.classList.add('peek-visible');

  // After bar is in the viewport, measure zone and zoom in
  requestAnimationFrame(() => {
    const zoneMap  = TYPE_CONFIG[activeType]?.zoneMap || {};
    const zoneName = ghostField ? zoneMap[ghostField] : (ghostCol ? 'zone-table' : null);
    const zoneEl   = zoneName ? doc.querySelector(`[data-zone="${zoneName}"]`) : null;
    if (!zoneEl) return;

    // Measure via rects — bar is now on-screen so values are reliable
    const docRect  = doc.getBoundingClientRect();
    const zoneRect = zoneEl.getBoundingClientRect();
    const zW = zoneRect.width;
    const zH = zoneRect.height;
    if (!zW || !zH) return;

    const zTop  = zoneRect.top  - docRect.top;
    const zLeft = zoneRect.left - docRect.left;

    const contextPad = 48;
    const scaleByH   = (barH * 0.55) / (zH + contextPad * 2);
    const scaleByW   = (barW * 0.92) / docW;
    const s = Math.min(scaleByH, scaleByW);

    const tx = barW / 2 - (zLeft + zW / 2) * s;
    const ty = barH / 2 - (zTop  + zH / 2) * s;

    wrap.style.transition = 'transform 220ms cubic-bezier(0.16,1,0.3,1)';
    wrap.style.transform  = `translate(${tx}px,${ty}px) scale(${s})`;
  });
}

function hidePeek() {
  if (peekTimer) { clearTimeout(peekTimer); peekTimer = null; }
  if (!peekActive) return;
  peekActive = false;
  previewGhostField = null;
  colGhostKey = null;
  const peekBar = document.getElementById('peek-bar');
  peekBar?.classList.remove('peek-visible');
  const wrap = document.querySelector('.peek-doc-wrap');
  if (wrap) wrap.style.transition = 'none';
  refreshPreviewImmediate();
}

function initFromParams() {
  const p      = new URLSearchParams(window.location.search);
  const mode   = p.get('mode');
  const tplName= p.get('tplName');
  const type   = p.get('type') || 'Sales Order';
  const titleEl= document.getElementById('topbar-title');

  // Build type-specific sections, mount checkboxes, set globals
  applyTypeConfig(type);

  // Show type in meta chip + update default label
  const typeChip = document.getElementById('type-display');
  if (typeChip) typeChip.textContent = type;
  const lblDefault = document.getElementById('lbl-default');
  if (lblDefault) lblDefault.textContent = `Set as default for ${type}`;
  const chkDefault = document.getElementById('chk-default');
  if (chkDefault) chkDefault.checked = p.get('isDefault') === '1';

  if (mode === 'new') {
    document.getElementById('tpl-name').value = '';
    if (titleEl) titleEl.textContent = 'New template';
  } else if (mode === 'clone') {
    if (titleEl) titleEl.textContent = 'New template';
  } else if (mode === 'edit') {
    if (titleEl) titleEl.textContent = 'Edit template';
  } else if (mode === 'view') {
    if (titleEl) titleEl.textContent = tplName || 'Template';
    const badge = document.getElementById('view-badge');
    if (badge) badge.style.display = 'inline-flex';
    document.querySelector('.settings-panel').classList.add('view-only');
    const chatEl = document.getElementById('agent-chat');
    if (chatEl) chatEl.style.display = 'none';
    document.querySelectorAll('.cb-row').forEach(row => {
      row.addEventListener('click', e => e.preventDefault(), true);
    });
    // Default checkbox writes directly to localStorage — no navigation needed
    document.getElementById('chk-default')?.addEventListener('change', function() {
      try {
        const key = 'qfx_custom_templates';
        const saved = JSON.parse(localStorage.getItem(key)) || [];
        if (this.checked) {
          // Restore standard as default: clear custom defaults for this type
          saved.forEach(t => { if (t.type === type) t.isOrgDefault = false; });
        }
        localStorage.setItem(key, JSON.stringify(saved));
      } catch {}
    });
  }

  if (tplName) document.getElementById('tpl-name').value = tplName;

  const tplDesc      = p.get('desc') || '';
  const basedOnName  = p.get('basedOnName') || '';
  const displayDesc  = tplDesc || (basedOnName ? 'Based on ' + basedOnName : '');
  const descInput = document.getElementById('tpl-desc');
  const descView  = document.getElementById('tpl-desc-view');
  if (descInput) { descInput.value = tplDesc; resizeDescTextarea(); }
  if (descView)  descView.textContent = displayDesc;
}

/* ── Mount checkbox group ───────────────────────────────────────────────── */
function buildFieldEditorHTML(fieldGroups, defaultActive) {
  return fieldGroups.map(grp => {

    const allHTML = grp.fields.map(f => {
      const active = defaultActive[f.name] !== false;
      const locked = f.locked ? ' disabled' : '';
      return `<label class="cb-row" data-field="${f.name}" data-group="${grp.id}">
        <input type="checkbox" class="check-box" data-group="${grp.id}" data-field="${f.name}"
          ${active ? 'checked' : ''}${locked}>
        <span class="cb-label-text">${f.name}</span>
      </label>`;
    }).join('');

    return `<div class="cb-subsection" id="${grp.id}" data-cb-group="${grp.id}">
      <div class="cb-subsection-label">${grp.label}</div>
      <div class="cb-grid">${allHTML}</div>
    </div>`;
  }).join('');
}

function mountFieldEditor(sec) {
  sec.fieldGroups.forEach(grp => {
    const container = document.getElementById(grp.id);
    if (!container) return;
    container.querySelectorAll('input[type="checkbox"]:not([disabled])').forEach(cb => {
      cb.addEventListener('change', () => {
        const g = cb.dataset.group;
        const f = cb.dataset.field;
        if (!activeFieldSets[g]) activeFieldSets[g] = new Set();
        if (cb.checked) activeFieldSets[g].add(f);
        else            activeFieldSets[g].delete(f);
        // SO: sync paired column key in activeColumns and re-render picker
        const pairedKey = PAIRED_COL[f];
        if (activeType === 'Sales Order' && pairedKey && _isSoLocked(pairedKey)) {
          const visible = pairedColVisible(pairedKey);
          if (visible && !activeColumns.includes(pairedKey)) {
            activeColumns.push(pairedKey);
            _enforceSOLockedPositions();
          } else if (!visible) {
            activeColumns = activeColumns.filter(k => k !== pairedKey);
          }
          renderColPicker();
        }
        updateAllBadges();
        refreshPreviewImmediate();
      });
    });
  });
}

function mountCheckboxGroup(groupId) {
  const data = FIELDS[groupId];
  const container = document.getElementById(groupId);
  if (!container) return;

  container.className = 'cb-subsection';
  container.id = groupId;
  container.setAttribute('data-cb-group', groupId);

  container.innerHTML = `
    <div class="cb-subsection-label" id="cbsec-label-${groupId}">${data.label}</div>
    <div class="cb-grid">
      ${data.all.map((f, i) => `
        <label class="cb-row" id="cbrow-${groupId}-${i}" data-field="${f}" data-group="${groupId}">
          <input type="checkbox" class="check-box"
            data-group="${groupId}"
            data-field="${f}"
            ${data.sel.includes(f) ? 'checked' : ''}>
          <span class="cb-label-text">${f}</span>
        </label>
      `).join('')}
    </div>
  `;

  // Hover → zone highlight
  container.querySelectorAll('.cb-row').forEach(row => {
    row.addEventListener('mouseenter', () => highlightPreviewZone(row.dataset.field));
    row.addEventListener('mouseleave', () => clearPreviewZone());

    // Touch long-press → peek preview (tablet / mobile)
    row.addEventListener('touchstart', () => {
      const field = row.dataset.field;
      if (!field) return;
      peekTimer = setTimeout(() => showPeek(field, null), 480);
    }, { passive: true });
    row.addEventListener('touchmove',   () => { if (peekTimer) { clearTimeout(peekTimer); peekTimer = null; } }, { passive: true });
    row.addEventListener('touchend',    hidePeek, { passive: true });
    row.addEventListener('touchcancel', hidePeek, { passive: true });
  });

  // Checkbox change → update state + live preview
  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const g = cb.dataset.group;
      const f = cb.dataset.field;
      if (cb.checked) {
        if (!FIELDS[g].sel.includes(f)) FIELDS[g].sel.push(f);
      } else {
        FIELDS[g].sel = FIELDS[g].sel.filter(x => x !== f);
      }
      updateAllBadges();
      refreshPreviewImmediate();
    });
  });
}

/* ── Badges ─────────────────────────────────────────────────────────────── */
function updateAllBadges() {
  const cpSections = new Set(
    (TYPE_CONFIG[activeType]?.sections || []).filter(s => s.colPicker).map(s => s.badgeKey)
  );
  const feSections = new Set(
    (TYPE_CONFIG[activeType]?.sections || []).filter(s => s.fieldEditor).map(s => s.badgeKey)
  );
  Object.entries(SECTION_MAP).forEach(([key, ids]) => {
    const badge = document.getElementById('badge-' + key);
    if (!badge) return;
    if (cpSections.has(key)) {
      badge.textContent = activeColumns.length;
    } else if (feSections.has(key)) {
      badge.textContent = ids.reduce((n, id) => n + (activeFieldSets[id]?.size || 0), 0);
    } else {
      badge.textContent = ids.reduce((n, id) => n + (FIELDS[id]?.sel.length || 0), 0);
    }
  });
}

/* ── Live preview refresh (no loader) ───────────────────────────────────── */
function renderIntoPages(contentHTML, containerEl) {
  const isLandscape = pageOrientation === 'landscape';
  const baseW = isLandscape ? 960 : 700;
  const padX  = 64;  // horizontal margin each side
  const padY  = 56;  // vertical margin each side
  const pageH = Math.round(baseW * (isLandscape ? 8.5 / 11 : 11 / 8.5));
  const vpW   = baseW - padX * 2;  // content viewport width
  const vpH   = pageH - padY * 2;  // content viewport height

  // Measure raw content height at viewport width (no Y padding needed here)
  const measurer = document.createElement('div');
  measurer.style.cssText = `position:fixed;visibility:hidden;pointer-events:none;top:-9999px;width:${vpW}px;`;
  measurer.innerHTML = contentHTML;
  document.body.appendChild(measurer);
  const contentH = measurer.scrollHeight;
  document.body.removeChild(measurer);

  const numPages = Math.max(1, Math.ceil(contentH / vpH));
  let html = '';
  for (let i = 0; i < numPages; i++) {
    const pageLabel = numPages > 1 ? `<div class="preview-page-num">${i + 1} / ${numPages}</div>` : '';
    // Viewport sits between the top and bottom margins; scroll shifts content per page
    html += `<div class="preview-page" style="height:${pageH}px">
      <div class="preview-page-viewport" style="top:${padY}px;left:${padX}px;right:${padX}px;height:${vpH}px;">
        <div class="preview-page-scroll" style="top:${-i * vpH}px;">
          ${contentHTML}
        </div>
      </div>
      ${pageLabel}
    </div>`;
  }
  containerEl.innerHTML = html;
}

function refreshPreviewImmediate() {
  const doc = document.getElementById('preview-doc');
  if (doc && doc.style.display !== 'none') {
    renderIntoPages(buildPreviewHTML(), doc);
    requestAnimationFrame(updatePageCounter);
  }
}

/* ── Ghost hover ────────────────────────────────────────────────────────── */
let previewGhostField = null;

function highlightPreviewZone(fieldName) {
  // For checked fields: zone outline (existing)
  const zone = FIELD_ZONES[fieldName];
  if (zone) {
    clearPreviewZone();
    document.querySelectorAll(`[data-zone="${zone}"]`).forEach(el => el.classList.add('zone-active'));
  }
  // For unchecked fields: inject ghost into preview
  const isSel = Object.values(FIELDS).some(g => g.sel.includes(fieldName));
  if (!isSel) {
    previewGhostField = fieldName;
    refreshPreviewImmediate();
  }
}

function clearPreviewZone() {
  document.querySelectorAll('[data-zone].zone-active').forEach(el => el.classList.remove('zone-active'));
  if (previewGhostField) {
    previewGhostField = null;
    refreshPreviewImmediate();
  }
}

/* ── Search ─────────────────────────────────────────────────────────────── */
const SEARCH_INDEX = [];

function buildSearchIndex() {
  SEARCH_INDEX.length = 0; // clear on re-build

  // Section entries — always include Layout & Style + active type sections
  const cfg = TYPE_CONFIG[activeType] || TYPE_CONFIG['Sales Order'];
  const sectionEntries = [
    { type: 'section', targetId: 'sec-style', label: 'Layout & Style', icon: 'ph-paint-brush', context: 'Section' },
    ...cfg.sections.map(s => ({ type: 'section', targetId: s.id, label: s.title, icon: 'ph-layout', context: 'Section' })),
  ];
  sectionEntries.forEach(s => SEARCH_INDEX.push(s));

  // Build group → section title lookup from GROUP_SECTION
  const secTitleById = {};
  cfg.sections.forEach(s => { secTitleById[s.id] = s.title; });
  const groupSectionTitle = gid => secTitleById[GROUP_SECTION[gid]] || '';

  Object.entries(FIELDS).forEach(([groupId, data]) => {
    SEARCH_INDEX.push({
      type: 'subsection',
      targetId: groupId,
      label: data.label,
      icon: 'ph-list-bullets',
      context: groupSectionTitle(groupId),
    });
    data.all.forEach((field, i) => {
      SEARCH_INDEX.push({
        type: 'field',
        targetId: `cbrow-${groupId}-${i}`,
        groupId,
        label: field,
        icon: 'ph-check-square',
        context: data.label,
      });
    });
  });

  // Column picker entries — index every column in the pool
  const colSec = cfg.sections.find(s => s.colPicker);
  if (colSec) {
    const pool = TYPE_CONFIG[activeType]?.colPool || [];
    pool.forEach(c => {
      SEARCH_INDEX.push({
        type: 'column',
        key: c.key,
        sectionId: colSec.id,
        label: c.key,
        icon: 'ph-table',
        context: colSec.title,
      });
    });
  }

  const input = document.getElementById('field-search');
  const clearBtn = document.getElementById('search-clear');

  input.addEventListener('input', () => {
    handleSearch(input.value);
    clearBtn.classList.toggle('visible', input.value.length > 0);
  });

  input.addEventListener('focus', () => {
    if (input.value.trim()) showSearchResults(input.value);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    handleSearch('');
    input.focus();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const results = document.getElementById('search-results');
      if (results.classList.contains('open')) {
        results.classList.remove('open');
        input.blur();
      }
    }
  });
}

function handleSearch(query) {
  const q = query.trim().toLowerCase();
  const results = document.getElementById('search-results');

  if (!q) {
    results.classList.remove('open');
    document.querySelectorAll('.cb-row').forEach(r => r.classList.remove('search-dim', 'search-match'));
    document.querySelectorAll('.cp-inv-item, .cp-active-item').forEach(r => r.classList.remove('search-dim', 'search-match'));
    return;
  }

  // Checkbox rows
  document.querySelectorAll('.cb-row').forEach(row => {
    const match = row.dataset.field.toLowerCase().includes(q);
    row.classList.toggle('search-match', match);
    row.classList.toggle('search-dim', !match);
  });

  // Column picker items (both panels)
  document.querySelectorAll('.cp-inv-item, .cp-active-item').forEach(item => {
    const match = (item.dataset.key || '').toLowerCase().includes(q);
    item.classList.toggle('search-match', match);
    item.classList.toggle('search-dim', !match);
  });

  showSearchResults(query);
}

function showSearchResults(query) {
  const q = query.trim().toLowerCase();
  const results = document.getElementById('search-results');
  if (!q) { results.classList.remove('open'); return; }

  const matches = SEARCH_INDEX.filter(item => item.label.toLowerCase().includes(q));
  if (matches.length === 0) {
    results.innerHTML = `<div class="sr-empty">No results for "${query}"</div>`;
    results.classList.add('open');
    return;
  }

  const sections    = matches.filter(m => m.type === 'section');
  const subsections = matches.filter(m => m.type === 'subsection');
  const fields      = matches.filter(m => m.type === 'field');
  const columns     = matches.filter(m => m.type === 'column');

  let html = '';
  if (sections.length) {
    html += `<div class="sr-group-label">Sections</div>`;
    sections.forEach(m => { html += srItem(m); });
  }
  if (subsections.length) {
    html += `<div class="sr-group-label">Groups</div>`;
    subsections.forEach(m => { html += srItem(m); });
  }
  if (fields.length) {
    html += `<div class="sr-group-label">Fields</div>`;
    fields.forEach(m => { html += srItem(m); });
  }
  if (columns.length) {
    html += `<div class="sr-group-label">Table Columns</div>`;
    columns.forEach(m => { html += srItem(m); });
  }

  results.innerHTML = html;
  results.classList.add('open');

  results.querySelectorAll('.sr-item').forEach((el, i) => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      scrollToSearchResult(matches[i]);
      results.classList.remove('open');
    });
  });
}

function srItem(m) {
  return `
    <div class="sr-item">
      <i class="ph ${m.icon} sr-item-icon"></i>
      <div class="sr-item-main">
        <div class="sr-item-text">${m.label}</div>
        ${m.context ? `<div class="sr-item-context">${m.context}</div>` : ''}
      </div>
    </div>`;
}

function scrollToSearchResult(match) {
  const scroll = document.getElementById('settings-scroll');

  if (match.type === 'section') {
    const sec = document.getElementById(match.targetId);
    if (!sec) return;
    if (sec.classList.contains('closed')) sec.classList.remove('closed');
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  if (match.type === 'subsection') {
    const groupId = match.targetId;
    const parentSec = document.getElementById(GROUP_SECTION[groupId]);
    if (parentSec && parentSec.classList.contains('closed')) parentSec.classList.remove('closed');

    const label = document.getElementById(`cbsec-label-${groupId}`);
    if (!label) return;
    label.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => flashEl(label), 200);
    return;
  }

  if (match.type === 'field') {
    const parentSec = document.getElementById(GROUP_SECTION[match.groupId]);
    if (parentSec && parentSec.classList.contains('closed')) parentSec.classList.remove('closed');

    const row = document.getElementById(match.targetId);
    if (!row) return;
    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => flashEl(row), 200);

    setTimeout(() => {
      document.querySelectorAll('.cb-row').forEach(r => r.classList.remove('search-dim', 'search-match'));
    }, 900);
    return;
  }

  if (match.type === 'column') {
    // Open the Table Columns section if collapsed
    const sec = document.getElementById(match.sectionId);
    if (sec && sec.classList.contains('closed')) sec.classList.remove('closed');

    // Find the item in whichever panel it's currently in
    const item = document.querySelector(`.cp-inv-item[data-key="${CSS.escape(match.key)}"], .cp-active-item[data-key="${CSS.escape(match.key)}"]`);
    if (item) {
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      setTimeout(() => flashEl(item), 200);
    }

    setTimeout(() => {
      document.querySelectorAll('.cp-inv-item, .cp-active-item').forEach(r => r.classList.remove('search-dim', 'search-match'));
    }, 900);
  }
}

function flashEl(el) {
  el.classList.remove('flash');
  void el.offsetWidth; // reflow
  el.classList.add('flash');
  el.addEventListener('animationend', () => el.classList.remove('flash'), { once: true });
}

    item.classList.toggle('selected', item.dataset.val === val);

  wrap.classList.remove('open');
}

/* ── Global click handler ───────────────────────────────────────────────── */
function globalClickHandler(e) {
  const path = e.composedPath();
  document.querySelectorAll('.cs-wrap.open').forEach(w => {
    if (!path.includes(w)) w.classList.remove('open');
  });
  const searchWrap = document.getElementById('search-bar-wrap');
  const searchResults = document.getElementById('search-results');
  if (searchResults.classList.contains('open') && !path.includes(searchWrap)) {
    searchResults.classList.remove('open');
  }
}

    return inp && inp.value.trim() ? inp.value.trim() : 'custom';
  }
  return sel.value;
}

/* ── Generate Preview ───────────────────────────────────────────────────── */
function generatePreview() {
  const isMobile = window.innerWidth <= 767;
  if (isMobile) { openDrawer(); return; }

  const mode   = new URLSearchParams(window.location.search).get('mode');
  const delay  = mode === 'view' ? 1000 : 2000;

  const loader = document.getElementById('preview-loader');
  const doc    = document.getElementById('preview-doc');
  loader.classList.add('active');
  doc.style.display = 'none';
  setPreviewReady(false); // disable toolbar while skeleton shows

  setTimeout(() => {
    renderIntoPages(buildPreviewHTML(), doc);
    requestAnimationFrame(updatePageCounter);
    // Fade loader out, fade doc in
    loader.style.transition = 'opacity 320ms ease';
    loader.style.opacity    = '0';
    doc.style.opacity       = '0';
    doc.style.display       = 'block';
    doc.style.transition    = 'opacity 320ms ease';
    requestAnimationFrame(() => { doc.style.opacity = '1'; });
    setTimeout(() => {
      loader.classList.remove('active');
      loader.style.transition = '';
      loader.style.opacity    = '';
      doc.style.transition    = '';
      doc.style.opacity       = '';
      setPreviewReady(true); // enable toolbar + schedule line picker fade-in
    }, 360);
  }, delay);
}

function openDrawer() {
  const scrim  = document.getElementById('preview-scrim');
  const drawer = document.getElementById('preview-drawer');
  const loader = document.getElementById('drawer-loader');
  const doc    = document.getElementById('drawer-doc');

  scrim.classList.add('open');
  drawer.classList.add('open');
  document.body.style.overflow = 'hidden';

  loader.classList.add('active');
  doc.style.display = 'none';

  setTimeout(() => {
    loader.classList.remove('active');
    doc.style.display = 'block';
    doc.innerHTML = buildPreviewHTML();
  }, 900);
}

function closeDrawer() {
  document.getElementById('preview-scrim').classList.remove('open');
  document.getElementById('preview-drawer').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── Currency helpers ───────────────────────────────────────────────────── */
function parseDollar(s) { return parseFloat((s || '0').replace(/[$,]/g, '')) || 0; }
function fmtDollar(n)   { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
// Abbreviate "Firstname Lastname" → "F. Lastname" when column is narrow
const INSTALLER_ABBREV_THRESHOLD = 74; // px — below this, use abbreviated form
function fmtInstaller(name, widthPx) {
  if (!name) return name;
  if (widthPx >= INSTALLER_ABBREV_THRESHOLD) return name;
  const parts = name.trim().split(/\s+/);
  if (parts.length < 2) return name;
  return parts[0][0] + '. ' + parts.slice(1).join(' ');
}

// Check if a field is active in ANY activeFieldSets group (for fieldEditor types)
function wof(fieldName) {
  return Object.values(activeFieldSets).some(s => s.has(fieldName));
}
// Check if at least one sub-field of a paired column is active
function pairedColVisible(pairedKey) {
  return Object.values(activeFieldSets).some(s =>
    [...s].some(f => PAIRED_COL[f] === pairedKey)
  );
}

/* ── Sales Order preview ─────────────────────────────────────────────────── */
function buildSOPreviewHTML() {
  /* ── helpers ── */
  const hasSel    = f => Object.values(FIELDS).some(g => g.sel.includes(f));
  const isGhost   = f => previewGhostField === f && !hasSel(f);
  const hasStar   = f => hasSel(f) || isGhost(f); // selected or ghost

  /* ── read UI state ── */
  const logoPos  = getToggleValue('logo')   || 'left';
  const styleVal = getToggleValue('style')  || 'separated';
  const rTitle   = getRTitleValue();
  const showSubs = document.getElementById('chk-subtotals')?.checked ?? true;

  const TITLE_MAP = { proposal: 'PROPOSAL / SALES ORDER', invoice: 'PROPOSAL / INVOICE', none: 'SALES ORDER' };
  const titleText = TITLE_MAP[rTitle] ?? rTitle.toUpperCase();

  /* ── company / header ── */
  const showCompany = hasSel('Company Header') || hasSel('Location Header');
  const showPhone   = hasSel('Company Phone/Email');
  const showSoldTo  = hasSel('Sold To');
  const showShipTo  = hasSel('Ship To');
  // ghost versions
  const ghostPhone   = isGhost('Company Phone/Email');
  const ghostSoldTo  = isGhost('Sold To');
  const ghostShipTo  = isGhost('Ship To');

  /* ── dates meta table (with ghost row) ── */
  const DATE_VALS = {
    'Sales Order #': ['Sales Order #', 'SO-1001'],
    'Order Date':    ['Order Date',    '05/08/2025'],
    'Timestamp':     ['Timestamp',     '05/08/2025 09:14'],
    'Bill Date':     ['Bill Date',     '05/08/2025'],
    'Net Due':       ['Net Due',       '06/08/2025'],
    'Terms':         ['Terms',         'Net 30'],
    'PO #':          ['PO #',          'PO-5678'],
    'Invoice #':     ['Invoice #',     'INV-2025-0042'],
    'Sale Date':     ['Sale Date',     '05/01/2025'],
    'Next Install':  ['Next Install',  '06/01/2025'],
    'Sales Rep':     ['Sales Rep',     'Maria Davis'],
  };
  const dateRows     = Object.keys(DATE_VALS).filter(hasSel).map(k => ({ vals: DATE_VALS[k], ghost: false }));
  const ghostDateKey = DATE_VALS[previewGhostField] && !hasSel(previewGhostField) ? previewGhostField : null;
  if (ghostDateKey) dateRows.push({ vals: DATE_VALS[ghostDateKey], ghost: true });

  /* ── column defs — from activeColumns (dual-panel), plus ghost at pos 1 ── */
  const colPool = TYPE_CONFIG['Sales Order'].colPool;
  const colPoolMap = Object.fromEntries(colPool.map(c => [c.key, c]));

  const ALL_COL_DEFS = activeColumns
    .filter(k => colPoolMap[k])
    .map(k => { const def = Object.assign({}, colPoolMap[k], { ghost: false }); const ew = colWidths[k] ?? autoFitWidths[k]; if (ew != null) def.w = ew + 'px'; return def; });
  // Insert ghost column at position 0 (first col) if hovering inventory
  if (colGhostKey && !activeColumns.includes(colGhostKey) && colPoolMap[colGhostKey]) {
    ALL_COL_DEFS.splice(0, 0, Object.assign({}, colPoolMap[colGhostKey], { ghost: true }));
  }

  /* ── mock rows ── */
  const ALL_ROWS = cycleRows(SO_ROW_TPL, previewLineCount);

  /* ── table cell helpers (ghost-aware) ── */
  function thS(c) {
    let s = c.r ? 'text-align:right' : 'text-align:left';
    if (c.w) s += ';width:' + c.w;
    const cls = c.ghost ? ' class="ghost-th"' : '';
    return `${cls} style="${s}"`;
  }
  function tdS(c) {
    if (c.ghost) return c.r ? ' class="ghost-td td-r"' : ' class="ghost-td"';
    return c.r ? ' class="td-r"' : '';
  }

  function buildCombinedTable(allCols, rows) {
    const showLineComments = allCols.some(c => c.subRow && c.key === 'Line Comments');
    const cols = allCols.filter(c => !c.subRow);
    const cellVal = (c, r) => {
      if (c.key === 'Qty') {
        if (r._t === 'p' || r._t === 'pl') {
          const q = wof('Product Qty') ? r['Product Quantity'] || '' : '';
          const u = wof('Product Units') && r['Product Units'] ? r['Product Units'] : '';
          return q && u ? `${q} ${u}` : q;
        }
        if (r._t === 'l') {
          const q = wof('Labor Qty') ? r['Labor Quantity'] || '' : '';
          const u = wof('Labor Units') && r['Labor Units'] ? r['Labor Units'] : '';
          return q && u ? `${q} ${u}` : q;
        }
      }
      if (c.key === 'Price') {
        if (r._t === 'p' || r._t === 'pl') return wof('Product Price') ? r['Product Price'] || '' : '';
        if (r._t === 'l') return wof('Labor Price') ? r['Labor Price'] || '' : '';
      }
      if (c.key === 'Total') {
        if (r._t === 'p' || r._t === 'pl') return wof('Product Total') ? r['Product Total'] || '' : '';
        if (r._t === 'l') return wof('Labor Total') ? r['Labor Total'] || '' : '';
      }
      if (c.key === 'Installer Name') return fmtInstaller(r[c.key] ?? '', parseInt(c.w));
      return r[c.key] ?? '';
    };
    const commentRow = r => (showLineComments && r['Line Comments'])
      ? `<tr class="so-line-comment"><td colspan="${cols.length}">${r['Line Comments']}</td></tr>` : '';
    if (!cols.length) return `<p style="font-size:11.5px;color:rgba(47,51,55,.4);font-style:italic;margin-bottom:16px;padding:8px 0">No columns selected</p>`;
    const colSpan = cols.length;
    const grpHdStyle = `padding:6px 10px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(47,51,55,.38);background:rgba(0,0,0,.015)`;
    const subStyle   = `padding:0`;
    const subInner   = (lbl, val) => `<div style="display:flex;justify-content:flex-end;padding:4px 10px;font-size:11px;border-top:1px solid rgba(0,0,0,.07);color:rgba(47,51,55,.6)"><span style="margin-right:16px">${lbl}</span><span>${val}</span></div>`;
    let tbodyRows = '';
    const totalW = cols.reduce((s, c) => s + (parseInt(c.w) || 0), 0);
    const fScale = tableAdaptiveText ? Math.min(1, getPrintWidth() / totalW) : 1;
    const fontStyle = fScale < 0.999 ? `font-size:${(10 * fScale).toFixed(1)}px;--tbl-th-size:${(8.5 * fScale).toFixed(1)}px;` : '';

    // Simplified header helpers
    const rightKeys = new Set(['Qty', 'Units', 'Price', 'Total']);
    const contentCols2 = cols.filter(c => !rightKeys.has(c.key));
    const rightCols2   = cols.filter(c =>  rightKeys.has(c.key));
    const colgroup = `<colgroup>${cols.map(c => `<col style="width:${c.w}">`).join('')}</colgroup>`;
    const mkHeader = (contentLabel) => {
      const contentTh = contentCols2.length
        ? `<th colspan="${contentCols2.length}" style="text-align:left">${contentLabel}</th>`
        : '';
      const rightThs = rightCols2.map(c => `<th style="text-align:right">${c.hdr}</th>`).join('');
      return `<thead><tr>${contentTh}${rightThs}</tr></thead>`;
    };

    // Expand combined rows for separated/groups; keep as single row for flat/classic
    const expandedRows = (styleVal === 'separated' || styleVal === 'groups')
      ? rows.flatMap(r => r._t === 'pl' ? [
          { ...r, _t:'p', 'Installer Name':'','Labor Type':'','Labor Units':'','Labor Quantity':'','Labor Price':'','Labor Total':'' },
          { ...r, _t:'l', 'Description':'','Style':'','Color':'','Material #':'','Product Units':'','Product Quantity':'','Product Price':'','Product Total':'' },
        ] : [r])
      : rows;

    if (styleVal === 'separated') {
      const pRows = expandedRows.filter(r => r._t === 'p');
      const lRows = expandedRows.filter(r => r._t === 'l');
      const PRODUCT_ONLY = new Set(['Description', 'Color', 'Style', 'Material #', 'Product #', 'Dimensions']);
      const LABOR_ONLY   = new Set(['Installer Name', 'Labor Type']);
      const pCols = cols.filter(c => !LABOR_ONLY.has(c.key));
      const lCols = cols.filter(c => !PRODUCT_ONLY.has(c.key));
      const mkSepTable = (tCols, label, dataRows, subtotalVal) => {
        const tContent = tCols.filter(c => !rightKeys.has(c.key));
        const tRight   = tCols.filter(c =>  rightKeys.has(c.key));
        // Right cols get fixed widths; content cols get no width so they share remaining space equally (table-layout:fixed)
        const tColgroup = `<colgroup>${tCols.map(c => rightKeys.has(c.key) ? `<col style="width:${c.w}">` : `<col>`).join('')}</colgroup>`;
        const tSpan = tCols.length;
        const thead = `<thead><tr>${tContent.length ? `<th colspan="${tContent.length}" style="text-align:left">${label}</th>` : ''}${tRight.map(c => `<th style="text-align:right">${c.hdr}</th>`).join('')}</tr></thead>`;
        let tbody = dataRows.map(r => `<tr>${tCols.map(c => `<td${tdS(c)}>${cellVal(c,r)}</td>`).join('')}</tr>${commentRow(r)}`).join('');
        if (showSubs) tbody += `<tr><td colspan="${tSpan}" style="${subStyle}">${subInner(label + ' subtotal', fmtDollar(subtotalVal))}</td></tr>`;
        return `<table class="so-table" style="${fontStyle}table-layout:fixed;margin-bottom:12px" data-zone="zone-table">${tColgroup}${thead}<tbody>${tbody}</tbody></table>`;
      };
      let html = '';
      if (pRows.length) {
        const pSubtotal = pRows.reduce((s, r) => s + parseDollar(r['Product Total']), 0);
        html += mkSepTable(pCols, 'Materials', pRows, pSubtotal);
      }
      if (lRows.length) {
        const lSubtotal = lRows.reduce((s, r) => s + parseDollar(r['Labor Total']), 0);
        html += mkSepTable(lCols, 'Labor', lRows, lSubtotal);
      }
      return html;
    } else if (styleVal === 'groups') {
      // Line items grouped by user-defined groups; distribute all rows across groups proportionally
      const n = expandedRows.length;
      const cuts = [Math.ceil(n * 0.5), Math.ceil(n * 0.8)];
      const MOCK_GROUPS = [
        { label: 'Living Room', slice: [0,         cuts[0]] },
        { label: 'Bedroom',     slice: [cuts[0],   cuts[1]] },
        { label: 'Kitchen',     slice: [cuts[1],   n      ] },
      ].filter(g => g.slice[0] < g.slice[1]);
      MOCK_GROUPS.forEach(grp => {
        const grpRows = expandedRows.slice(...grp.slice);
        if (!grpRows.length) return;
        tbodyRows += `<tr><td colspan="${colSpan}" style="${grpHdStyle}">${grp.label}</td></tr>`;
        tbodyRows += grpRows.map(r => `<tr>${cols.map(c => `<td${tdS(c)}>${cellVal(c,r)}</td>`).join('')}</tr>${commentRow(r)}`).join('');
        if (showSubs) {
          const grpSubtotal = grpRows.reduce((s, r) => s + parseDollar(r['Product Total']) + parseDollar(r['Labor Total']), 0);
          tbodyRows += `<tr><td colspan="${colSpan}" style="${subStyle}">${subInner(grp.label + ' subtotal', fmtDollar(grpSubtotal))}</td></tr>`;
        }
      });
    } else {
      tbodyRows = expandedRows.map(r => `<tr>${cols.map(c => `<td${tdS(c)}>${cellVal(c,r)}</td>`).join('')}</tr>${commentRow(r)}`).join('');
    }
    const thead = styleVal === 'groups' ? mkHeader('') : mkHeader('Material / Labor');

  const soTotalAmt = fmtDollar(previewLineCount * 378.00 + 1240.00);
  // Center logo: identity block centered above the meta row
  let headerHTML = '';
  if (logoPos === 'center') {
    headerHTML = `
      <div class="so-doc-title-row">${titleText}</div>

  if (showSoldTo || showShipTo || ghostSoldTo || ghostShipTo) {

  /* ── assemble ── */

let _aiDescOriginal = null;

function _buildDescContext() {
  const pool    = TYPE_CONFIG[activeType]?.colPool || [];
  const colKeys = activeColumns.filter(k => pool.some(c => c.key === k && !c.subRow));
  const selFields = [];
  Object.values(FIELDS).forEach(g => selFields.push(...g.sel));
  return {
    type:        activeType,
    style:       getToggleValue('style') || 'separated',
    orientation: pageOrientation,
    logo:        (getToggleValue('logo') || 'left') !== 'none',
    subtotals:   document.getElementById('chk-subtotals')?.checked ?? true,
    columns:     colKeys,
    fields:      selFields,
  };
}

// Classify user-written text before deciding how AI should treat it
function _classifyUserText(text) {
  const t = (text || '').trim();
  if (!t) return 'empty';
  const hasSpaces = /\s/.test(t);

  // Single-token code / ID patterns (no spaces, structured)
  if (!hasSpaces && /^[A-Za-z0-9]{1,8}[-_/#@.]\S+$|^[A-Z]{2,10}\d*$|^v\d|^\d+\.\d/.test(t))
    return 'code';

  // Vowel ratio — English prose averages ~38%; keyboard mash has very few
  const alpha  = t.replace(/[^a-zA-Z]/g, '');
  if (!alpha.length) return 'gibberish';
  const vCount = (alpha.match(/[aeiouAEIOU]/g) || []).length;
  const vRatio = vCount / alpha.length;

  if (hasSpaces)  return vRatio >= 0.12 ? 'prose' : 'gibberish';
  return (vRatio >= 0.20 && vCount >= 2) ? 'prose' : 'gibberish';
}

// Return true when user text is clearly related to reports / business workflow
function _isRelevantToReport(text) {
  if (!text?.trim()) return true;
  const t = text.toLowerCase();
  const keywords = [
    'order','invoice','proposal','quote','estimate','report','template',
    'job','project','client','customer','contractor','site','field',
    'install','labor','material','vendor','supplier','purchase',
    'work','sales','commercial','residential','roofing','flooring',
    'signature','terms','total','billing','contract','payment',
    'standard','default','custom','large','small','monthly','weekly',
    'repair','renovation','construction','service','document','form',
  ];
  return keywords.some(kw => t.includes(kw));
}

function _generateDesc(ctx, userText) {
  const typeShort  = { 'Sales Order': 'Sales order', 'Work Order': 'Work order', 'Purchase Order': 'Purchase order' }[ctx.type] || ctx.type;
  const styleFull  = { separated: 'products and labor listed separately', groups: 'items organized by room or area', flat: 'all line items in a single list' }[ctx.style] || ctx.style;
  const styleShort = { separated: 'split P&L', groups: 'grouped by area', flat: 'flat list' }[ctx.style] || ctx.style;

  // Collect all signals, pick top 3 for richer output
  const hasPricing   = ctx.columns.some(k => ['Product Total','Labor Total','Total','Price','Labor Cost','Product Price'].includes(k));
  const hasInstaller = ctx.columns.some(k => ['Installer','Installer Name'].includes(k));
  const hasStatus    = ctx.columns.includes('Status');
  const hasSig    = ctx.fields.some(f => ['Signature Block','Signature Line'].includes(f));
  const hasTerms  = ctx.fields.includes('Terms and Conditions');
  const hasNotes  = ctx.fields.includes('Notes');
  const hasSoldTo = ctx.fields.some(f => ['Sold To','Bill To'].includes(f));

  const signals = [];
  if (hasInstaller)                    signals.push('installer assignment');
  if (hasSig)                          signals.push('customer signature');
  if (hasTerms)                        signals.push('terms & conditions');
  if (hasStatus)                       signals.push('job status tracking');
  if (hasNotes)                        signals.push('notes field');
  if (hasPricing)                      signals.push('line-item pricing');
  if (hasSoldTo)                       signals.push('customer details');
  if (ctx.orientation === 'landscape') signals.push('landscape layout');

  // Comma-joined list with Oxford and
  const joinSignals = (arr) => arr.length <= 1 ? (arr[0] || '') :
    arr.slice(0, -1).join(', ') + ' and ' + arr.at(-1);

  const top3 = signals.slice(0, 3);

  const kind       = _classifyUserText(userText);
  const relevant   = _isRelevantToReport(userText);
  const useUserText = (kind === 'prose' && relevant) || kind === 'code';

  let desc;
  if (kind === 'code') {
    const feat = top3.length ? joinSignals(top3.slice(0, 2)) : styleShort;
    desc = `${userText.trim()} — ${typeShort.toLowerCase()}, ${feat}.`;
  } else if (useUserText) {
    // Intelligible + relevant — rewrite, integrating the settings context
    const base = userText.trim().replace(/[.!?…\s]+$/, '');
    const feat  = top3.length ? joinSignals(top3) : styleFull;
    desc = `${base}. Features ${feat}.`;
  } else {
    // Gibberish, off-topic, or empty — fresh generation
    const feat = top3.length ? joinSignals(top3) : styleFull;
    desc = `${typeShort} — ${feat}. Layout: ${styleShort}.`;
  }

  return desc;
}

async function improveDescWithAI() {
  const textarea  = document.getElementById('tpl-desc');
  const idleEl    = document.getElementById('desc-ai-idle');
  const confirmEl = document.getElementById('desc-ai-confirm');

/* ── Clone from view mode — staged 4-phase transition ──────────────────── */
function activateCloneFromView() {
  const btn      = document.getElementById('btn-clone');
  const panel    = document.querySelector('.settings-panel');
  const badge    = document.getElementById('view-badge');
  const title    = document.getElementById('topbar-title');
  const nameEl   = document.getElementById('tpl-name');
  const descInput= document.getElementById('tpl-desc');
  const descView = document.getElementById('tpl-desc-view');
  const descField= document.getElementById('desc-edit-field');

  if (!panel) return;

  // Save zoom before anything re-renders
  const savedZoom = userZoomOverride;

  // Update URL params now so Save knows this is a clone
  const p = new URLSearchParams(window.location.search);
  const newId = 'c' + Date.now();
  p.set('mode', 'clone');
  p.set('tplId', newId);
  const baseName = (nameEl?.value || p.get('tplName') || 'Template').replace(/^Copy of\s*/i, '');
  p.set('tplName', 'Copy of ' + baseName);
  window.history.replaceState({}, '', '?' + p.toString());

  // ── Phase 0 (0ms): button spinner ─────────────────────────────────────
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ph ph-circle-notch desc-ai-spinner"></i> Cloning…'; }

  // Scroll to top immediately so meta-block is in view
  document.getElementById('settings-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });

  // ── Phase 1 (450ms): chrome — badge fades, title cross-dissolves ──────
  setTimeout(() => {
    if (badge) {
      badge.style.transition = 'opacity 390ms ease';
      badge.style.opacity = '0';
      setTimeout(() => { badge.style.display = 'none'; badge.style.opacity = ''; badge.style.transition = ''; }, 420);
    }
    if (title) {
      title.style.transition = 'opacity 270ms ease';
      title.style.opacity = '0';
      setTimeout(() => {
        title.textContent = 'New template';
        title.style.opacity = '1';
        setTimeout(() => { title.style.transition = ''; title.style.opacity = ''; }, 300);
      }, 285);
    }
  }, 450);

  // ── Phase 2 (960ms): name field morphs ───────────────────────────────
  // Remove .view-only (unlocks fields), but hold sections + desc with pending classes
  setTimeout(() => {
    panel.classList.add('clone-secs-pending', 'clone-desc-pending');
    panel.classList.remove('view-only');

    // The #tpl-name CSS transition animates border/bg/padding automatically now
    if (nameEl) nameEl.value = 'Copy of ' + baseName;
  }, 960);

  // ── Phase 3 (1530ms): description morphs ─────────────────────────────
  setTimeout(() => {
    // Fade out the static view text
    if (descView) {
      descView.style.transition = 'opacity 330ms ease';
      descView.style.opacity = '0';
    }
    setTimeout(() => {
      // Swap: hide view, show field
      if (descView) { descView.style.display = 'none'; descView.style.opacity = ''; descView.style.transition = ''; }
      panel.classList.remove('clone-desc-pending');

      // Fade the desc field in
      if (descField) {
        descField.style.opacity = '0';
        descField.style.transition = 'opacity 450ms ease';
        requestAnimationFrame(() => { descField.style.opacity = '1'; });
        setTimeout(() => { descField.style.transition = ''; descField.style.opacity = ''; }, 480);
      }
      if (descInput) descInput.readOnly = false;
      requestAnimationFrame(() => requestAnimationFrame(resizeDescTextarea));
    }, 345);
  }, 1530);

  // ── Phase 4 (2070ms): sections cascade in via shared animation function ─
  setTimeout(() => {
    // Pre-hide section children before removing clone-secs-pending (display:none → block)
    panel.querySelectorAll('.settings-scroll .section').forEach(sec => {
      sec.style.opacity = '0';
      const hd    = sec.querySelector('.section-hd');
      const body  = sec.querySelector('.section-body');
      const caret = sec.querySelector('.section-caret');
      if (hd)    hd.style.opacity    = '0';
      if (body)  body.style.opacity  = '0';
      if (caret) caret.style.opacity = '0';
    });

    panel.classList.remove('clone-secs-pending');

    // Restore zoom before sections appear
    userZoomOverride = savedZoom;
    updatePreviewZoom();
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ph ph-copy"></i> Clone'; btn.style.display = ''; }

    _animateSectionsIn(panel);
  }, 2070);
}

function handleSave() {
  const nameEl    = document.getElementById('tpl-name');
  const name      = nameEl.value.trim();
  if (!name) {
    nameEl.classList.add('error');
    nameEl.focus();
    nameEl.addEventListener('input', () => nameEl.classList.remove('error'), { once: true });
    return;
  }
  const isDefault = document.getElementById('chk-default')?.checked ? '1' : '0';
  const desc      = (document.getElementById('tpl-desc')?.value || '').trim();
  const p         = new URLSearchParams(window.location.search);
  const tplId     = p.get('tplId') || '';
  const url       = new URL('report-templates.html', window.location.href);
  url.searchParams.set('saved', name);
  url.searchParams.set('isDefault', isDefault);
  if (desc)  url.searchParams.set('desc', desc);
  if (tplId) url.searchParams.set('tplId', tplId);
  window.location.href = url.toString();
}

/* ── Drag resize ────────────────────────────────────────────────────────── */
(function () {
  const handle   = document.getElementById('drag-handle');
  const panel    = document.querySelector('.settings-panel');
  const MIN_W    = 320;
  const MAX_W    = 700;
  let dragging   = false;
  let startX     = 0;
  let startWidth = 0;

  handle.addEventListener('mousedown', e => {
    dragging   = true;
    startX     = e.clientX;
    startWidth = panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor     = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta    = e.clientX - startX;
    const newWidth = Math.min(MAX_W, Math.max(MIN_W, startWidth + delta));
    panel.style.width      = newWidth + 'px';
    panel.style.flexShrink = '0';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor     = '';
    document.body.style.userSelect = '';
  });
})();

function matchAgentRules(input) {
  const q = input.toLowerCase();
  const merged = { enable: [], disable: [], toggles: {}, checkboxes: {} };
  const descs  = [];

  AGENT_RULES.forEach(rule => {
    if (rule.match.some(kw => q.includes(kw))) {
      (rule.apply.enable  || []).forEach(f => { if (!merged.enable.includes(f))  merged.enable.push(f);  });
      (rule.apply.disable || []).forEach(f => { if (!merged.disable.includes(f)) merged.disable.push(f); });
      Object.assign(merged.toggles,    rule.apply.toggles    || {});
      Object.assign(merged.checkboxes, rule.apply.checkboxes || {});
      descs.push(rule.desc);
    }
  });

  return descs.length ? { changes: merged, descs } : null;
}

function applyAgentPlan(plan) {
  // Synchronous apply (used for non-animated direct application)
  const { enable, disable, toggles, checkboxes } = plan.changes;
  const applied = { enabled: [], disabled: [], toggles: [], checkboxes: [] };

  enable.forEach(field => {
    Object.entries(FIELDS).forEach(([gid, data]) => {
      if (data.all.includes(field) && !data.sel.includes(field)) {
        data.sel.push(field);
        applied.enabled.push(field);
      }
    });
  });

  disable.forEach(field => {
    Object.entries(FIELDS).forEach(([gid, data]) => {
      if (data.sel.includes(field)) {
        data.sel = data.sel.filter(f => f !== field);
        applied.disabled.push(field);
      }
    });
  });

  Object.entries(toggles).forEach(([group, value]) => {
    const prev = getToggleValue(group);
    if (prev !== value) {
      setToggleValueDOM(group, value);
      const labels = { style: 'Table style', logo: 'Logo', rtitle: 'Title' };
      applied.toggles.push(`${labels[group] || group}: ${value}`);
    }
  });

  Object.entries(checkboxes || {}).forEach(([id, checked]) => {
    const el = document.getElementById(id);
    if (el && el.checked !== checked) {
      el.checked = checked;
      const labelMap = { 'chk-subtotals': 'Subtotals' };
      applied.checkboxes.push(`${labelMap[id] || id}: ${checked ? 'on' : 'off'}`);
    }
  });

  syncCheckboxesFromState();
  updateAllBadges();
  return applied;
}

/* ── Animated agent apply (step by step, visible in editor) ─────────────── */
function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

function findCbRowByField(fieldName) {
  return document.querySelector(`.cb-row[data-field="${CSS.escape(fieldName)}"]`);
}

function findParentSection(el) {
  return el.closest('.section');
}

async function applyAgentPlanAnimated(plan) {
  const { enable, disable, toggles, checkboxes } = plan.changes;
  const applied = { enabled: [], disabled: [], toggles: [], checkboxes: [] };
  const scroll = document.getElementById('settings-scroll');

  // Build ordered steps
  const steps = [
    ...Object.entries(toggles).map(([g, v]) => ({ type: 'toggle', group: g, value: v })),
    ...Object.entries(checkboxes || {}).map(([id, v]) => ({ type: 'checkbox', id, value: v })),
    ...enable.map(f  => ({ type: 'enable',  field: f })),
    ...disable.map(f => ({ type: 'disable', field: f })),
  ];

  for (const step of steps) {
    await delay(230);

    if (step.type === 'enable' || step.type === 'disable') {
      const on = step.type === 'enable';
      let changed = false;
      Object.entries(FIELDS).forEach(([gid, data]) => {
        if (data.all.includes(step.field)) {
          if (on && !data.sel.includes(step.field)) { data.sel.push(step.field); changed = true; }
          else if (!on && data.sel.includes(step.field)) { data.sel = data.sel.filter(f => f !== step.field); changed = true; }
        }
      });
      if (changed) {
        if (on) applied.enabled.push(step.field);
        else    applied.disabled.push(step.field);

        // Sync checkbox DOM + scroll to it
        const row = findCbRowByField(step.field);
        if (row) {
          const sec = findParentSection(row);
          if (sec && sec.classList.contains('closed')) sec.classList.remove('closed');
          row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          const cb = row.querySelector('input[type="checkbox"]');
          if (cb) cb.checked = on;
          row.classList.remove('agent-flash');
          void row.offsetWidth;
          row.classList.add('agent-flash');
        }
        updateAllBadges();
        refreshPreviewImmediate();
        await delay(380);
      }

    } else if (step.type === 'toggle') {
      if (step.group === 'rtitle') {
        // rtitle is now a <select>
        const sel = document.getElementById('rtitle-select');
        if (sel && sel.value !== step.value) {
          sel.value = step.value;
          onRTitleChange(sel);
          applied.toggles.push(`Title: ${step.value}`);
          sel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          await delay(300);
        }
      } else {
        const prev = getToggleValue(step.group);
        if (prev !== step.value) {
          setToggleValueDOM(step.group, step.value);
          const labels = { style: 'Table style', logo: 'Logo' };
          applied.toggles.push(`${labels[step.group] || step.group}: ${step.value}`);
          const slider = document.querySelector(`.toggle-slider[data-group="${step.group}"]`);
          if (slider) slider.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          refreshPreviewImmediate();
          await delay(300);
        }
      }

    } else if (step.type === 'checkbox') {
      const el = document.getElementById(step.id);
      if (el && el.checked !== step.value) {
        el.checked = step.value;
        const labelMap = { 'chk-subtotals': 'Subtotals' };
        applied.checkboxes.push(`${labelMap[step.id] || step.id}: ${step.value ? 'on' : 'off'}`);
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        refreshPreviewImmediate();
        await delay(280);
      }
    }
  }

  return applied;
}

function syncCheckboxesFromState() {
  Object.entries(FIELDS).forEach(([groupId, data]) => {
    data.all.forEach((field, i) => {
      const cb = document.querySelector(`#cbrow-${groupId}-${i} input[type="checkbox"]`);
      if (cb) cb.checked = data.sel.includes(field);
    });
  });
}

function setToggleValueDOM(groupName, value) {
  document.querySelectorAll(`.toggle-slider[data-group="${groupName}"] .toggle-slider-opt`)
    .forEach(opt => opt.classList.toggle('active', opt.dataset.value === value));
}

function sendAgentMessage(text) {
  if (!text.trim()) return;
  agentState.messages.push({ role: 'user', text });
  renderAgentMessages();

  const plan = matchAgentRules(text);
  if (!plan) {
    agentState.messages.push({
      role: 'assistant',
      text: "I didn't find a matching adjustment for that. Try describing the report's purpose — for example: \"customer-friendly proposal\", \"separate labor and materials\", or \"minimal invoice\".",
      changelines: null,
    });
    renderAgentMessages();
    return;
  }

  // Use animated apply — show each change in real time
  applyAgentPlanAnimated(plan).then(applied => {
    const hasChanges = applied.enabled.length || applied.disabled.length ||
                       applied.toggles.length  || applied.checkboxes.length;

    const changelines = [];
    if (applied.enabled.length)    changelines.push({ cls: 'add',    text: `+ ${applied.enabled.join(', ')}` });
    if (applied.disabled.length)   changelines.push({ cls: 'remove', text: `– ${applied.disabled.join(', ')}` });
    applied.toggles.forEach(t   => changelines.push({ cls: 'set',    text: `~ ${t}` }));
    applied.checkboxes.forEach(c => changelines.push({ cls: 'set',   text: `~ ${c}` }));

    agentState.messages.push({
      role: 'assistant',
      text: hasChanges ? plan.descs.join(' ') : 'Those settings are already applied — nothing changed.',
      changelines: hasChanges ? changelines : null,
    });

    renderAgentMessages();
  });
}

function agentSend() {
  const input = document.getElementById('agent-input');
  const val   = input.value.trim();
  if (!val) return;
  input.value = '';
  sendAgentMessage(val);
}

function renderAgentMessages() {
  const container = document.getElementById('agent-messages');
  if (!container) return;
  if (!agentState.messages.length) {
    const chips = [
      'Customer-friendly proposal',
      'Separate labor and materials',
      'Minimal invoice layout',
      'Hide internal fields',
    ];
    container.innerHTML = `
      <div class="agent-empty">
        <p class="agent-empty-hint">Describe what this report is for — I'll select the right fields.</p>
        <div class="agent-chips">
          ${chips.map(c => `<button class="agent-chip" onclick="useAgentChip(this)">${escHtml(c)}</button>`).join('')}
        </div>
      </div>`;
    return;
  }

  container.innerHTML = agentState.messages.map(msg => {
    if (msg.role === 'user') {
      return `<div class="agent-msg user"><div class="agent-msg-bubble">${escHtml(msg.text)}</div></div>`;
    }
    let inner = `<div class="agent-msg-text">${escHtml(msg.text)}</div>`;
    if (msg.changelines && msg.changelines.length) {
      inner += `<div class="agent-changes">` +
        msg.changelines.map(l => `<div class="agent-change-row ${l.cls}">${escHtml(l.text)}</div>`).join('') +
        `</div>`;
    }
    return `<div class="agent-msg assistant"><div class="agent-msg-bubble">${inner}</div></div>`;
  }).join('');

  container.scrollTop = container.scrollHeight;
}

function useAgentChip(btn) {
  sendAgentMessage(btn.textContent);
}

function clearAgentChat() {
  agentState.messages = [];
  renderAgentMessages();
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ── Toast ──────────────────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg, icon = 'ph-check-circle') {
  const t = document.getElementById('toast');
  t.innerHTML = `<i class="ph ${icon}" style="font-size:15px;"></i> ${msg}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>

body.dev-vp-mobile  { max-width: 390px;  margin: 0 auto; overflow-x: hidden; }

  right: max(0px, calc((100vw - 820px) / 2));
}
body.dev-vp-mobile .preview-drawer {
  left:  max(0px, calc((100vw - 390px) / 2));

}
/* Scrim: same inset so it doesn't bleed beyond simulated viewport */
body.dev-vp-tablet .preview-scrim {

  right: max(0px, calc((100vw - 820px) / 2));
}
body.dev-vp-mobile .preview-scrim {
  left:  max(0px, calc((100vw - 390px) / 2));
  right: max(0px, calc((100vw - 390px) / 2));
}
/* Tablet: hide preview panel until user opens drawer */
body.dev-vp-tablet .preview-panel,
body.dev-vp-tablet .drag-handle { display: none !important; }
body.dev-vp-tablet .settings-panel { width: 100% !important; flex: 1; }
</style>

<script>
function devToggle(which) {
  if (which === 'search') {
    const el = document.getElementById('search-bar-wrap');
    const btn = document.getElementById('dev-search');
    const hidden = el.style.display === 'none';
    el.style.display = hidden ? '' : 'none';
    btn.classList.toggle('on', hidden);
  } else if (which === 'assistant') {
    const el = document.getElementById('agent-chat');
    const btn = document.getElementById('dev-assistant');
    const hidden = el.style.display === 'none';
    el.style.display = hidden ? '' : 'none';
    btn.classList.toggle('on', hidden);
  }
}

function devViewport(vp) {
  document.body.classList.remove('dev-vp-tablet', 'dev-vp-mobile');
  if (vp === 'tablet') document.body.classList.add('dev-vp-tablet');
  if (vp === 'mobile') document.body.classList.add('dev-vp-mobile');
  ['desktop','tablet','mobile'].forEach(v => {
    document.getElementById('dev-vp-' + v)?.classList.toggle('on', v === vp);
  });
  // Recalibrate preview zoom after viewport width changes
  requestAnimationFrame(() => updatePreviewZoom?.());
}
</script>
